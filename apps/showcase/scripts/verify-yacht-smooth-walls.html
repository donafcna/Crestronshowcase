const out=document.querySelector('#report'),sleep=ms=>new Promise(r=>setTimeout(r,ms));document.querySelector('button').onclick=async()=>{const report={runs:[]};try{const w=document.querySelector('iframe').contentWindow;for(let i=0;i<300&&!w.__ftvYachtExterior?.nightFinish;i++)await sleep(50);w.__ftvPaused=true;w.__ftvYachtExterior.setTestTime(45);w.__ftvModel.viewport({x:0,y:0,w:1280,h:800});

w.__ftvModel.select('11');w.snap();capture('start');w.tick(.15);capture('lowering');w.tick(.35);capture('lowered');w.tick(1);
report.behavior=w.eval(`(()=>{const checks={},assert=(key,value)=>{checks[key]=!!value;},room=rooms[11],side=room.wallSides.find(s=>s.amount===1),p=side.parts.find(p=>roomOriginalMaterials.get(p.o)===M.wall),furniture=[];room.g.traverse(o=>{if(o.userData.softBox)furniture.push([o,o.position.clone(),o.scale.clone(),o.visible]);});const top=()=>p.o.position.y+p.o.scale.y/2;
assert('fullyLowered',Math.abs(top()-.22)<1e-6);const before=side.amount;setMode('exterior');assert('noJumpOnDeselect',side.amount===before);let prior=side.amount,monotonic=true;for(let i=0;i<120;i++){updateRoomCutaway(1/60);monotonic&&=side.amount<=prior;prior=side.amount;}assert('progressiveRaise',monotonic&&side.amount===0);assert('exactHeightRestored',p.o.position.y===p.y&&p.o.scale.y===p.sy);
focusRoom(11);yaw=desiredYaw;updateRoomCutaway(.1);assert('intermediateHeight',side.amount>0&&side.amount<1);const partial=side.amount;yaw+=Math.PI;updateRoomCutaway(0);assert('noJumpOnOrbit',side.amount===partial);updateRoomCutaway(.1);assert('smoothReversal',side.amount<partial&&side.amount>0);
focusRoom(20);const previous=side.amount;updateRoomCutaway(0);assert('noJumpOnRoomChange',side.amount===previous);for(const r of rooms){focusRoom(r.id);yaw=desiredYaw;updateRoomCutaway(.04);}setMode('exterior');for(let i=0;i<150;i++)updateRoomCutaway(1/60);assert('allRoomsRestored',rooms.every(r=>r.wallSides.every(s=>s.amount===0&&s.parts.every(p=>p.o.position.y===p.y&&p.o.scale.y===p.sy&&p.o.visible===p.visible))));assert('animationSetEmpty',movingWallSides.size===0);assert('furnitureUnchanged',furniture.every(([o,p,s,v])=>o.position.equals(p)&&o.scale.equals(s)&&o.visible===v));
focusRoom(11);yaw=desiredYaw;updateRoomCutaway(1/60,true);assert('reducedMotionImmediate',room.wallSides.some(s=>s.amount===1));setMode('exterior');updateRoomCutaway(1/60,true);assert('reducedMotionRestore',movingWallSides.size===0);return checks;})()`);
// Compare the same wall state machine with immediate or gradual transforms while orbiting.
w.eval(`window.smoothUpdate=updateRoomCutaway;sea.update=()=>{};window.count=0;const old=renderer.render.bind(renderer);renderer.render=(...args)=>{window.count++;return old(...args);};window.motionMode=instant=>{yaw=desiredYaw=-.4;updateRoomCutaway=(dt)=>{desiredYaw+=dt*.6;smoothUpdate(dt,instant);};};`);
for(const subject of ['11','20','30']){w.__ftvModel.select(subject);w.__ftvModel.viewport({x:620,y:100,w:420,h:600});w.snap();w.__ftvPaused=false;for(const instant of [true,false,false,true]){out.textContent='Espace '+subject+' : mesure '+(report.runs.length%4+1)+'/4';w.motionMode(instant);await sleep(1500);w.count=0;const start=performance.now();await sleep(4200);report.runs.push({subject,instant,fps:w.count*1000/(performance.now()-start),...w.eval('({calls:renderer.info.render.calls,triangles:renderer.info.render.triangles,textures:renderer.info.memory.textures})')});}}
