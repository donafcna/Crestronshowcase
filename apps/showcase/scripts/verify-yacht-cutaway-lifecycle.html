<!doctype html><meta charset="utf-8"><button id="run">Vérifier rotations et restauration</button><pre id="report">Prêt</pre><iframe src="/ftv-luxury/models/yacht.html" style="width:1280px;height:800px"></iframe><script>
const sleep=ms=>new Promise(r=>setTimeout(r,ms));document.querySelector('button').onclick=async()=>{const w=document.querySelector('iframe').contentWindow;for(let i=0;i<300&&!w.__ftvYachtExterior?.nightFinish;i++)await sleep(50);w.__ftvPaused=true;const result=w.eval(`(()=>{const results=[];for(const r of rooms){focusRoom(r.id);for(const angle of [-2.4,-.7,.7,2.4]){yaw=angle;updateRoomCutaway();let valid=true;for(const side of r.wallSides){const near=side.sign*(side.axis==='x'?Math.sin(angle):Math.cos(angle))>.18;for(const p of side.parts){const wall=p.o.material===M.wall||roomOriginalMaterials.get(p.o)===M.wall;if(near&&wall)valid&&=Math.abs(p.o.position.y+p.o.scale.y/2-.22)<.00001;else if(!near)valid&&=p.o.position.y===p.y&&p.o.scale.y===p.sy&&p.o.visible===p.visible;}}results.push({id:r.id,angle,valid});}}setMode('exterior');const restored=rooms.every(r=>r.wallSides.every(s=>s.parts.every(p=>p.o.position.y===p.y&&p.o.scale.y===p.sy&&p.o.visible===p.visible)));return{cases:results.length,failures:results.filter(r=>!r.valid),restored,selected:__ftvModel.state().room};})()`);document.querySelector('#report').textContent=JSON.stringify(result,null,2);};</script>
