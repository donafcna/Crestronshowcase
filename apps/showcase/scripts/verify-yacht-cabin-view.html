<!doctype html><meta charset="utf-8"><title>Yacht — angles des cabines</title><button id="run">Vérifier les cabines</button><pre id="report">Prêt</pre><div id="captures"></div><iframe id="model" src="/ftv-luxury/models/yacht.html" style="width:1280px;height:800px"></iframe><script>
const out=document.querySelector('#report'),sleep=ms=>new Promise(r=>setTimeout(r,ms));
document.querySelector('button').onclick=async()=>{const report={cabins:[],runs:[]};try{const w=document.querySelector('iframe').contentWindow;for(let i=0;i<300&&!w.__ftvYachtExterior?.nightFinish;i++)await sleep(50);w.__ftvYachtExterior.setTestTime(45);w.__ftvPaused=true;w.__ftvModel.viewport({x:0,y:0,w:1280,h:800});
w.eval(`window.testSnap=()=>{radius=desiredRadius;yaw=desiredYaw;pitch=desiredPitch;target.copy(desiredTarget);camera.position.set(target.x+Math.sin(yaw)*Math.cos(pitch)*radius,target.y+Math.sin(pitch)*radius,target.z+Math.cos(yaw)*Math.cos(pitch)*radius);camera.lookAt(target);const v=window.__ftvViewport;camera.setViewOffset(v.w,v.h,-v.x,-v.y,innerWidth,innerHeight);camera.updateMatrixWorld();renderer.render(scene,camera);};window.testAngle=before=>{const r=selectedRoom;desiredYaw=(before&&r.type==='bed'?1:-1)*.65;if(r.z<-.5)desiredYaw=Math.PI-desiredYaw;desiredRadius=fitRoom(r);testSnap();};`);
const capture=id=>{const im=document.createElement('img');im.id=id;im.style.width='48%';im.src=w.__yacht.renderer.domElement.toDataURL('image/jpeg',.75);document.querySelector('#captures').append(im);};
for(const r of w.__yacht.rooms.filter(r=>['bed','owner','crew'].includes(r.type))){w.__ftvModel.select(r.id);const values=[];for(const before of [true,false]){w.testAngle(before);if(r.id===30)capture(before?'before':'after');values.push(w.eval(`(()=>{const pillows=[],heads=[];selectedRoom.g.traverse(o=>{if(o.userData.softBox?.kind==='pillow')pillows.push(o);if(o.userData.softBox?.kind==='headboard')heads.push(o);});let hidden=0;for(const p of pillows){const center=p.getWorldPosition(new THREE.Vector3()),delta=center.clone().sub(camera.position),ray=new THREE.Raycaster(camera.position,delta.clone().normalize(),0,delta.length()-.01);if(ray.intersectObjects(heads).length)hidden++;}return{hidden,pillows:pillows.length,radius:desiredRadius,pitch:desiredPitch,yaw:desiredYaw,failed:renderer.info.programs.filter(p=>p.diagnostics?.runnable===false).length};})()`));}report.cabins.push({id:r.id,name:r.name,before:values[0],after:values[1]});}
w.__ftvModel.select('30');w.__ftvModel.viewport({x:620,y:100,w:420,h:600});w.eval(`sea.update=()=>{};window.count=0;const old=renderer.render.bind(renderer);renderer.render=(...args)=>{count++;return old(...args);};`);w.__ftvPaused=false;
for(const before of [true,false,false,true]){out.textContent='Mesure '+(report.runs.length+1)+'/4';w.testAngle(before);await sleep(1200);w.count=0;const start=performance.now();await sleep(4000);report.runs.push({before,fps:w.count*1000/(performance.now()-start),...w.eval('({calls:renderer.info.render.calls,triangles:renderer.info.render.triangles,textures:renderer.info.memory.textures})')});}
const avg=before=>{const rs=report.runs.filter(r=>r.before===before);return rs.reduce((s,r)=>s+r.fps,0)/rs.length;};report.performance={before:avg(true),after:avg(false),percent:(avg(false)/avg(true)-1)*100};report.status=report.cabins.every(r=>r.after.hidden===0&&!r.after.failed&&Math.abs(r.after.radius-r.before.radius)<.01&&r.after.pitch===r.before.pitch)&&report.performance.percent>-3?'passed':'failed';
}catch(e){report.error=String(e.stack||e);}out.textContent=JSON.stringify(report,null,2);};</script>
