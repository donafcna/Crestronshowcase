<!doctype html><meta charset="utf-8"><title>Yacht — rapprochement et contraste</title><style>body{font:14px system-ui;background:#102733;color:white;margin:0}button{padding:12px}iframe{width:1280px;height:800px;border:0}pre{white-space:pre-wrap}img{width:48%}</style><button id="run">Vérifier contraste, cadrages et fluidité</button><pre id="report">Prêt</pre><div id="view"></div><div id="captures"></div><script type="module">
const sleep=ms=>new Promise(r=>setTimeout(r,ms)),out=document.querySelector('#report'),report={fits:[],rooms:[],runs:[],errors:[]};
const capture=(w,id)=>{const im=document.createElement('img');im.id=id;im.src=w.__yacht.renderer.domElement.toDataURL('image/png');document.querySelector('#captures').append(im);};
document.querySelector('button').onclick=async()=>{try{
let before=await(await fetch('/yacht-close-before.html')).text();let oldFit=before.slice(before.indexOf('const fitYacht=')+15);oldFit=oldFit.slice(0,oldFit.indexOf(";let mode='exterior'"));
let source=await(await fetch('/ftv-luxury/models/yacht.html')).text();source=source.replace('<head>','<head><base href="/ftv-luxury/models/">').replace("l.intensity=(+$('cove').value*.045 + +$('spot').value*.055 + +$('accent').value*.025)","l.intensity=window.__benchOld?(+$('cove').value*.13 + +$('spot').value*.16 + +$('accent').value*.07):(+$('cove').value*.045 + +$('spot').value*.055 + +$('accent').value*.025)");
const frame=document.createElement('iframe');frame.srcdoc=source;document.querySelector('#view').append(frame);for(let i=0;i<400;i++){await sleep(50);if(frame.contentWindow.__ftvYachtExterior?.nightFinish)break;}const w=frame.contentWindow;if(!w.__ftvYachtExterior?.nightFinish)throw Error('initialisation');w.addEventListener('error',e=>report.errors.push(e.message));
w.eval(`auto=false;sea.update=()=>{};window.__oldFraming={points:[],target:new THREE.Vector3()};exterior.updateWorldMatrix(true,true);exterior.traverse(o=>{if(!o.isMesh||o.isInstancedMesh||!o.geometry||o.material?.transparent||o.material?.isShaderMaterial)return;for(let parent=o;parent&&parent!==exterior;parent=parent.parent)if(parent===window.__ftvYachtExterior?.root)return;if(!o.geometry.boundingBox)o.geometry.computeBoundingBox();const b=o.geometry.boundingBox;for(const x of [b.min.x,b.max.x])for(const y of [b.min.y,b.max.y])for(const z of [b.min.z,b.max.z]){const p=new THREE.Vector3(x,y,z).applyMatrix4(o.matrixWorld);p.y=Math.max(-1.5,p.y);window.__oldFraming.points.push(p);}});window.__newColors=Object.fromEntries(['cream','taupe','wall','rug'].map(k=>[k,M[k].color.clone()]));window.__oldColors={cream:0xe9dfc7,taupe:0xbaa58e,wall:0xd4c9b3,rug:0xc6b8a1};window.__originalMaterials=new WeakMap();for(const r of rooms)r.g.traverse(o=>{if(o.isMesh)window.__originalMaterials.set(o,o.material);});window.__benchPalette=after=>{window.__benchOld=!after;for(const k of Object.keys(window.__oldColors))M[k].color.set(after?window.__newColors[k]:window.__oldColors[k]);for(const r of rooms)r.g.traverse(o=>{const m=window.__originalMaterials.get(o);if(!m||o.material===roomContextMaterial)return;o.material=after?m:m===M.mattress?M.cream:m===M.bedlinen||m===M.headboard?M.taupe:m;});updateRoomLights();};window.__snap=()=>{radius=desiredRadius;yaw=desiredYaw;pitch=desiredPitch;target.copy(desiredTarget);camera.position.copy(target).add(new THREE.Vector3(Math.sin(yaw)*Math.cos(pitch),Math.sin(pitch),Math.cos(yaw)*Math.cos(pitch)).multiplyScalar(radius));camera.lookAt(target);const v=window.__ftvViewport;camera.setViewOffset(v.w,v.h,-v.x,-v.y,innerWidth,innerHeight);camera.updateMatrixWorld();renderer.render(scene,camera);};window.__count=0;const prior=renderer.render.bind(renderer);renderer.render=(...args)=>{const result=prior(...args);window.__count++;return result;};`);
w.eval('window.__oldFit=('+oldFit.replaceAll('exteriorFraming','window.__oldFraming')+');');
const profiles=[{x:620,y:100,w:420,h:600},{x:350,y:80,w:700,h:620},{x:80,y:60,w:1100,h:680},{x:0,y:80,w:440,h:600}];
for(const profile of profiles){w.__ftvModel.overview();w.__ftvModel.viewport(profile);const check=w.eval(`(()=>{window.__snap();const actual=exteriorFraming.points,p=new THREE.Vector3();let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;for(let i=0;i<actual.length;i+=3){p.fromArray(actual,i).project(camera);const x=(p.x*.5+.5)*innerWidth,y=(-p.y*.5+.5)*innerHeight;minX=Math.min(minX,x);maxX=Math.max(maxX,x);minY=Math.min(minY,y);maxY=Math.max(maxY,y);}const v=window.__ftvViewport,newRadius=desiredRadius,oldRadius=window.__oldFit();return{inside:minX>=v.x-.1&&maxX<=v.x+v.w+.1&&minY>=v.y-.1&&maxY<=v.y+v.h+.1,newRadius,oldRadius,closerPercent:(1-newRadius/oldRadius)*100,bounds:{minX,maxX,minY,maxY},vertices:actual.length/3};})()`);report.fits.push({profile,...check});}
w.__ftvPaused=true;w.__ftvModel.viewport({x:0,y:0,w:1280,h:800});
for(const id of ['30','11','22','0']){for(const after of [false,true])for(const time of [2,45]){w.__ftvModel.select(id);w.__ftvYachtExterior.setTestTime(time);w.eval('window.__benchPalette('+after+');window.__snap();');if(id==='30'||after&&time===2)capture(w,(after?'after-':'before-')+id+'-'+time);}}
for(const room of w.__ftvModel.catalog){w.__ftvModel.select(room.id);w.eval('window.__benchPalette(true);window.__snap();');report.rooms.push({id:room.id,selected:w.__ftvModel.state().room});}report.colors=w.eval(`Object.fromEntries(['wall','mattress','bedlinen','headboard'].map(k=>[k,'#'+M[k].color.getHexString()]))`);
for(const subject of (location.search.includes('quick')?[]:['captain','exterior'])){w.__ftvModel.viewport(profiles[0]);if(subject==='captain')w.__ftvModel.select('30');else w.__ftvModel.overview();const newPose=w.eval('({radius:desiredRadius,target:desiredTarget.toArray(),yaw:desiredYaw,pitch:desiredPitch})');w.__ftvYachtExterior.setTestTime(45);w.__ftvPaused=false;for(const after of [false,true,true,false]){out.textContent=subject+' : mesure '+(report.runs.length%4+1)+'/4';w.eval('window.__benchPalette('+after+');');if(subject==='exterior')w.eval(after?`desiredRadius=${newPose.radius};desiredTarget.fromArray(${JSON.stringify(newPose.target)});desiredYaw=${newPose.yaw};desiredPitch=${newPose.pitch};`:'desiredRadius=window.__oldFit();desiredTarget.copy(window.__oldFraming.target);desiredYaw=-.68;desiredPitch=.16;');w.eval('window.__snap();');await sleep(2500);w.__count=0;const t=performance.now();await sleep(5000);report.runs.push({subject,after,fps:w.__count*1000/(performance.now()-t),...w.eval(`({calls:renderer.info.render.calls,triangles:renderer.info.render.triangles,textures:renderer.info.memory.textures,failed:renderer.info.programs.filter(p=>p.diagnostics?.runnable===false).length})`)});}}
report.performance={};for(const subject of ['captain','exterior']){const avg=flag=>report.runs.filter(r=>r.subject===subject&&r.after===flag).reduce((s,r)=>s+r.fps,0)/2;report.performance[subject]={before:avg(false),after:avg(true),percent:(avg(true)/avg(false)-1)*100};}report.status=report.fits.every(f=>f.inside&&f.closerPercent>0)&&report.rooms.every(r=>r.id===r.selected)&&Object.values(report.performance).every(p=>p.percent>-3)&&report.runs.every(r=>!r.failed)&&!report.errors.length?'passed':'failed';
}catch(e){report.errors.push(String(e.stack||e));report.status='failed';}out.textContent=JSON.stringify(report,null,2);};
</script>
