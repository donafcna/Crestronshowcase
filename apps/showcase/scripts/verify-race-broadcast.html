<!doctype html><meta charset="utf-8"><title>Course 3D — avant/après</title><style>body{margin:0;background:#131b24;color:#e9eff4;font:16px system-ui}nav{height:64px;display:flex;gap:12px;align-items:center;padding:0 20px}button{font:inherit;padding:9px 16px}canvas{width:100%;height:calc(100vh - 120px);display:block}#status{padding:12px}pre{white-space:pre-wrap}</style><nav><b>Frequence TV · Course 3D</b><button id="before">Avant</button><button id="after">Après</button><button id="pause">Pause / lecture</button><button id="angle">Changer de caméra</button><button id="bench">Mesurer</button><input id="seek" aria-label="Instant" type="number" value="6" min="0" max="80" step="1" style="width:65px"></nav><canvas></canvas><div id="status"></div><pre id="result"></pre><script type="module">
import * as T from '/plan3d/vendor/three.module.min.js';import {createTVStage} from '/plan3d/tv-stage.js';
const canvas=document.querySelector('canvas'),status=document.querySelector('#status'),result=document.querySelector('#result');
const renderer=new T.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight-120,false);renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;
const screen=new T.Scene(),camera=new T.OrthographicCamera(-1,1,1,-1,.1,5);camera.position.z=1;const material=new T.MeshBasicMaterial({toneMapped:false});screen.add(new T.Mesh(new T.PlaneGeometry(2,2),material));let stage,flag=true,time=6,paused=false,last=0,busy=false,frames=0;const errors=[];addEventListener('error',e=>errors.push(e.message));
function mount(f){stage?.dispose();flag=f;stage=createTVStage(renderer,{realisticRace:f});material.map=stage.texture;material.needsUpdate=true;time=6;stage.render(2,time);status.textContent=(f?'APRÈS':'AVANT')+' — animation 640 × 360, 15 images/s';}
function tick(t){requestAnimationFrame(tick);if(t-last<1000/15)return;last=t-(t-last)%(1000/15);if(!paused&&!busy)time+=1/15;stage.render(2,time);renderer.setRenderTarget(null);renderer.render(screen,camera);frames++;}mount(true);requestAnimationFrame(tick);
for(const [id,f] of [['before',false],['after',true]])document.querySelector('#'+id).onclick=()=>{if(!busy)mount(f);};document.querySelector('#pause').onclick=()=>{paused=!paused;status.textContent=paused?'Pause — caméra figée':'Lecture';};document.querySelector('#angle').onclick=()=>{time+=12;};
document.querySelector('#seek').oninput=e=>{time=Number(e.target.value);paused=true;status.textContent='Pause — instant '+time+' s';};
document.querySelector('#bench').onclick=async()=>{if(busy)return;busy=true;const report={viewport:[innerWidth,innerHeight],dpr:devicePixelRatio,runs:[],errors};for(let pass=0;pass<2;pass++)for(const f of(pass?[true,false]:[false,true])){mount(f);await new Promise(r=>setTimeout(r,1000));const start=performance.now(),first=frames;const times=[];for(let k=0;k<45;k++){const t=performance.now();time=6+k/15;stage.render(2,time);times.push(performance.now()-t);await new Promise(r=>setTimeout(r,1000/15));}times.sort((a,b)=>a-b);report.runs.push({refined:f,fps:(frames-first)*1000/(performance.now()-start),submitMedianMs:times[22],submitP95Ms:times[42],...stage.metrics(),textures:renderer.info.memory.textures});result.textContent=JSON.stringify(report);}report.status=errors.length?'failed':'complete';result.textContent=JSON.stringify(report,null,2);busy=false;mount(true);};
</script>
