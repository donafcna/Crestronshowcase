<!doctype html><meta charset="utf-8"><title>Yacht — murs et caméra synchronisés</title><button id="run">Vérifier la synchronisation</button><pre id="report">Prêt</pre><div id="captures"></div><iframe src="/ftv-luxury/models/yacht.html" style="width:1280px;height:800px"></iframe><script>
const out=document.querySelector('#report'),sleep=ms=>new Promise(r=>setTimeout(r,ms));document.querySelector('button').onclick=async()=>{const subjects=new URLSearchParams(location.search).get('subjects')?.split(',')||['11','20','30'];const report={runs:[]};try{const w=document.querySelector('iframe').contentWindow;for(let i=0;i<300&&!w.__ftvYachtExterior?.nightFinish;i++)await sleep(50);w.__ftvPaused=true;w.__ftvYachtExterior.setTestTime(45);w.__ftvModel.viewport({x:0,y:0,w:1280,h:800});
w.eval(`window.snap=()=>{radius=desiredRadius;yaw=desiredYaw;pitch=desiredPitch;target.copy(desiredTarget);camera.position.set(target.x+Math.sin(yaw)*Math.cos(pitch)*radius,target.y+Math.sin(pitch)*radius,target.z+Math.cos(yaw)*Math.cos(pitch)*radius);camera.lookAt(target);const v=window.__ftvViewport;camera.setViewOffset(v.w,v.h,-v.x,-v.y,innerWidth,innerHeight);camera.updateMatrixWorld();renderer.render(scene,camera);};window.tick=t=>{for(let i=0;i<Math.round(t*60);i++)updateRoomCutaway(1/60);renderer.render(scene,camera);};`);

report.behavior=w.eval(`(()=>{const checks={},assert=(k,v)=>checks[k]=!!v,room=rooms[11];for(const r of rooms)restoreRoomWalls(r);retiringWallRooms.clear();focusRoom(11);snap();updateRoomCutaway(1/60,true);const side=room.wallSides.find(s=>s.axis==='z'&&s.sign===1);assert('settledFurnitureClear',side.amount===1);
focusRoom(18);const before=side.amount;updateRoomCutaway(0);assert('noJumpOnSelection',side.amount===before);assert('departingWallHeldDuringPan',side.target===1&&retiringWallRooms.has(room));for(let i=0;i<12;i++)updateRoomCutaway(1/60);assert('departingWallStaysLow',side.amount===1);
snap();updateRoomCutaway(0);assert('restoreStartsAfterArrival',side.target===0&&!retiringWallRooms.has(room));for(let i=0;i<120;i++)updateRoomCutaway(1/60);assert('departingWallRestored',room.wallSides.every(s=>s.amount===0));
focusRoom(11);snap();for(const r of rooms)restoreRoomWalls(r);retiringWallRooms.clear();target.set(room.x,decks[room.deck].position.y+.85,room.z);desiredTarget.copy(target);yaw=.4;desiredYaw=-Math.PI/2;radius=desiredRadius=12;camera.position.set(room.x+12,target.y,room.z);updateRoomCutaway(.05);const right=room.wallSides.find(s=>s.axis==='x'&&s.sign===1),left=room.wallSides.find(s=>s.axis==='x'&&s.sign===-1);assert('actualPositionOpensCorrectWall',right.target===1);assert('anticipatedPathOpensNextWall',left.target>.9);assert('progressiveMovement',right.amount>0&&right.amount<1&&left.amount>0&&left.amount<1);
const amount=right.amount;camera.position.x=room.x-12;desiredYaw=yaw=-Math.PI/2;updateRoomCutaway(0);assert('rotationHasNoJump',right.amount===amount);updateRoomCutaway(.1);assert('rotationReversesSmoothly',right.amount<amount&&right.amount>0);
for(const r of rooms){focusRoom(r.id);snap();updateRoomCutaway(.04);}setMode('exterior');snap();for(let i=0;i<150;i++)updateRoomCutaway(1/60);assert('rapidSelectionFullyRestored',rooms.every(r=>r.wallSides.every(s=>s.amount===0&&s.parts.every(p=>p.o.position.y===p.y&&p.o.scale.y===p.sy&&p.o.visible===p.visible))));assert('setsEmpty',movingWallSides.size===0&&retiringWallRooms.size===0);
focusRoom(11);snap();updateRoomCutaway(1/60,true);assert('reducedMotionImmediate',side.amount===1);setMode('exterior');snap();updateRoomCutaway(1/60,true);assert('reducedMotionRestoration',movingWallSides.size===0&&retiringWallRooms.size===0);return checks;})()`);
w.eval("window.baselineUpdate=function(dt=1/60,instant=false){\n if(cutawayRoom){const sx=Math.sin(yaw),sz=Math.cos(yaw);\n  for(const side of cutawayRoom.wallSides){const goal=THREE.MathUtils.smoothstep(side.sign*(side.axis==='x'?sx:sz),.08,.28);\n   if(goal!==side.target){side.target=goal;movingWallSides.add(side);}\n  }\n }\n for(const side of movingWallSides){\n  const delta=side.target-side.amount;\n  side.amount=instant||Math.abs(delta)<.001?side.target:side.amount+delta*(1-Math.exp(-Math.max(0,dt)*(delta>0?10:6)));\n  applyWallSide(side);if(side.amount===side.target)movingWallSides.delete(side);\n }\n}\n");

w.eval(`window.smoothUpdate=updateRoomCutaway;sea.update=()=>{};window.count=0;const old=renderer.render.bind(renderer);renderer.render=(...args)=>{window.count++;return old(...args);};window.motionMode=instant=>{for(const r of rooms)restoreRoomWalls(r);retiringWallRooms.clear();yaw=desiredYaw=-.4;updateRoomCutaway=(dt)=>{desiredYaw+=dt*.6;if(instant)baselineUpdate(dt);else smoothUpdate(dt);};};`);
for(const subject of subjects){w.__ftvModel.select(subject);w.__ftvModel.viewport({x:620,y:100,w:420,h:600});w.snap();w.__ftvPaused=false;for(const instant of [true,false,false,true]){out.textContent='Espace '+subject+' : mesure '+(report.runs.length%4+1)+'/4';w.motionMode(instant);await sleep(Number(new URLSearchParams(location.search).get('warm'))||1500);w.count=0;const start=performance.now();await sleep(Number(new URLSearchParams(location.search).get('measure'))||4200);report.runs.push({subject,instant,fps:w.count*1000/(performance.now()-start),...w.eval('({calls:renderer.info.render.calls,triangles:renderer.info.render.triangles,textures:renderer.info.memory.textures})')});}}

}catch(e){report.error=String(e.stack||e);}out.textContent=JSON.stringify(report,null,2);};</script>
