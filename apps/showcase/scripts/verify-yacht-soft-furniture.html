<!doctype html><meta charset="utf-8"><title>Yacht — mobilier souple</title><style>body{font:14px system-ui;background:#102733;color:white;margin:0}button{padding:12px}iframe{width:1280px;height:800px;border:0}pre{white-space:pre-wrap}img{width:48%}</style><button id="run">Comparer le mobilier et la fluidité</button><pre id="report">Prêt</pre><div id="view"></div><div id="captures"></div><script type="module">
const report={rooms:[],runs:[],errors:[]},out=document.querySelector('#report'),sleep=ms=>new Promise(r=>setTimeout(r,ms));let frame;
async function mount(after){if(frame){frame.contentWindow.__yacht?.renderer.dispose();frame.contentWindow.__yacht?.renderer.forceContextLoss();frame.remove();}frame=document.createElement('iframe');frame.src=after?'/ftv-luxury/models/yacht.html':'/yacht-soft-before.html';document.querySelector('#view').append(frame);for(let i=0;i<400;i++){await sleep(50);if(frame.contentWindow.__ftvYachtExterior?.nightFinish)break;}const w=frame.contentWindow;if(!w.__ftvYachtExterior?.nightFinish)throw Error('initialisation');w.addEventListener('error',e=>report.errors.push(e.message));w.__ftvYachtExterior.setTestTime(45);return w;}
const capture=(w,id)=>{const im=document.createElement('img');im.id=id;im.src=w.__yacht.renderer.domElement.toDataURL('image/png');document.querySelector('#captures').append(im);};
function snap(w){w.eval(`radius=desiredRadius;yaw=desiredYaw;pitch=desiredPitch;target.copy(desiredTarget);camera.position.copy(target).add(new THREE.Vector3(Math.sin(yaw)*Math.cos(pitch),Math.sin(pitch),Math.cos(yaw)*Math.cos(pitch)).multiplyScalar(radius));camera.lookAt(target);const v=window.__ftvViewport;camera.setViewOffset(v.w,v.h,-v.x,-v.y,innerWidth,innerHeight);camera.updateMatrixWorld();renderer.render(scene,camera);labelsUpdatedAt=0;positionRoomLabels(performance.now());`);}
document.querySelector('button').onclick=async()=>{report.rooms=[];report.runs=[];report.errors=[];document.querySelector('#captures').replaceChildren();try{
let w=await mount(false);w.__ftvPaused=true;w.__ftvModel.viewport({x:0,y:0,w:1280,h:800});report.baselineMeshes=w.eval(`(()=>{let n=0;model.traverse(o=>{if(o.isMesh)n++;});return n;})()`);for(const id of ['30','11','22','12']){w.__ftvModel.select(id);snap(w);capture(w,'before-'+id);}
w=await mount(true);w.__ftvPaused=true;w.__ftvModel.viewport({x:0,y:0,w:1280,h:800});report.geometry=w.eval(`(()=>{const soft=[],geometries=new Set();let meshes=0,finite=true;model.traverse(o=>{if(!o.isMesh)return;meshes++;if(!o.userData.softBox)return;soft.push(o);geometries.add(o.geometry);for(const name of ['position','normal'])for(const v of o.geometry.attributes[name].array)if(!Number.isFinite(v))finite=false;});window.__softOriginal=soft.map(o=>({o,geometry:o.geometry,scale:o.scale.clone()}));window.__shape=after=>{for(const {o,geometry,scale}of window.__softOriginal){o.geometry=after?geometry:boxGeo;if(after)o.scale.copy(scale);else{const s=o.userData.softBox;o.scale.set(s.w,s.h,s.d);}}};return{meshes,softMeshes:soft.length,cachedGeometries:geometries.size,finite};})()`);
for(const id of ['30','11','22','12']){w.__ftvModel.select(id);snap(w);capture(w,'after-'+id);}
for(const room of w.__ftvModel.catalog){w.__ftvModel.select(room.id);snap(w);report.rooms.push({id:room.id,selected:w.__ftvModel.state().room,failed:w.eval('renderer.info.programs.filter(p=>p.diagnostics?.runnable===false).length')});}
w.eval(`sea.update=()=>{};window.__count=0;const priorRender=renderer.render.bind(renderer);renderer.render=(...args)=>{const result=priorRender(...args);window.__count++;return result;};`);
for(const [subject,id]of [['captain','30'],['salon','11'],['exterior','all']]){w.__shape(true);w.__ftvModel.viewport({x:620,y:100,w:420,h:600});w.__ftvModel.select(id);snap(w);w.__ftvPaused=false;for(const after of [false,true,true,false]){out.textContent=subject+' : mesure '+(report.runs.length%4+1)+'/4';w.__shape(after);await sleep(1800);w.__count=0;const start=performance.now();await sleep(4200);report.runs.push({subject,after,fps:w.__count*1000/(performance.now()-start),...w.eval(`({calls:renderer.info.render.calls,triangles:renderer.info.render.triangles,textures:renderer.info.memory.textures,failed:renderer.info.programs.filter(p=>p.diagnostics?.runnable===false).length})`)});}}
report.performance={};for(const subject of ['captain','salon','exterior']){const avg=flag=>{const runs=report.runs.filter(r=>r.subject===subject&&r.after===flag);return runs.reduce((s,r)=>s+r.fps,0)/runs.length;};report.performance[subject]={before:avg(false),after:avg(true),percent:(avg(true)/avg(false)-1)*100};}report.status=report.geometry.finite&&report.geometry.meshes===report.baselineMeshes&&report.rooms.every(r=>r.id===r.selected&&!r.failed)&&Object.values(report.performance).every(p=>p.percent>-3)&&report.runs.every(r=>!r.failed)&&!report.errors.length?'passed':'failed';
}catch(e){report.errors.push(String(e.stack||e));report.status='failed';}out.textContent=JSON.stringify(report,null,2);};
</script>
