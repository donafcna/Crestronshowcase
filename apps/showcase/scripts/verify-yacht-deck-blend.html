<!doctype html><meta charset="utf-8"><title>Yacht — fondu entre ponts</title><button id="unit">Vérifier le fondu</button><button id="fps">Comparer la fluidité</button><pre id="report">Prêt</pre><div id="done" hidden>Terminé</div><div id="captures"></div><iframe src="/ftv-luxury/models/yacht.html" style="width:1280px;height:800px"></iframe><script>
const out=document.querySelector('#report'),done=document.querySelector('#done'),sleep=ms=>new Promise(r=>setTimeout(r,ms));async function setup(){const w=document.querySelector('iframe').contentWindow;for(let i=0;i<300&&!w.__ftvYachtExterior?.nightFinish;i++)await sleep(50);w.__ftvPaused=true;w.__ftvYachtExterior.setTestTime(45);w.eval(`window.snap=()=>{radius=desiredRadius;yaw=desiredYaw;pitch=desiredPitch;target.copy(desiredTarget);camera.position.set(target.x+Math.sin(yaw)*Math.cos(pitch)*radius,target.y+Math.sin(pitch)*radius,target.z+Math.cos(yaw)*Math.cos(pitch)*radius);camera.lookAt(target);const v=window.__ftvViewport;if(v)camera.setViewOffset(v.w,v.h,-v.x,-v.y,innerWidth,innerHeight);camera.updateMatrixWorld();renderer.render(scene,camera);};window.sourceAt=id=>{setMode('deck',rooms[id].deck,true);focusRoom(id);cameraJourney=null;cancelDeckBlend();snap();};window.samples=()=>{const gl=renderer.getContext(),values=[],pixel=new Uint8Array(4);for(const [x,y] of [[.2,.2],[.4,.4],[.5,.5],[.6,.6],[.8,.4],[.7,.2],[.4,.7],[.8,.8]]){gl.readPixels(Math.floor(gl.drawingBufferWidth*x),Math.floor(gl.drawingBufferHeight*y),1,1,gl.RGBA,gl.UNSIGNED_BYTE,pixel);values.push(...pixel);}return values;};`);return w;}
const capture=(w,id)=>{const im=document.createElement('img');im.id=id;im.style.width='32%';im.src=w.__yacht.renderer.domElement.toDataURL('image/jpeg',.8);document.querySelector('#captures').append(im);};
document.querySelector('#unit').onclick=async()=>{done.hidden=true;let report={};try{const w=await setup();w.__ftvModel.viewport({x:0,y:0,w:1280,h:800});report.checks=w.eval(`(()=>{const c={};sourceAt(11);const old=samples();focusRoom(30);const p=cameraJourney;advanceCameraJourney(p.duration*.51);camera.lookAt(target);camera.updateMatrixWorld();renderer.render(scene,camera);renderDeckBlend(0);const first=samples();c.exactOldFrame=first.every((v,i)=>Math.abs(v-old[i])<=1);c.activeAtSwap=deckBlend.active&&deckBlend.material.uniforms.alpha.value===1;window.deckTestPath=p;return c;})()`);capture(w,'old');w.eval('deckBlend.elapsed=.16;renderer.render(scene,camera);renderDeckBlend(0);');capture(w,'middle');report.checks.midOpacity= w.eval('Math.abs(deckBlend.material.uniforms.alpha.value-.5)<1e-6');Object.assign(report.checks,w.eval(`(()=>{deckBlend.elapsed=.32;renderer.render(scene,camera);const expected=samples();renderDeckBlend(0);const actual=samples();return{finalExact:expected.every((v,i)=>v===actual[i]),inactiveAfterFade:!deckBlend.active};})()`));capture(w,'new');
report.transitions=w.eval(`(()=>{const ids=[0,11,20,30,35],results=[];let texture=null;for(const from of ids)for(const to of ids){if(from===to)continue;sourceAt(from);focusRoom(to);const p=cameraJourney;advanceCameraJourney(p.duration*.51);camera.lookAt(target);camera.updateMatrixWorld();renderer.render(scene,camera);renderDeckBlend(.016);const reused=!texture||texture===deckBlend.texture;texture=deckBlend.texture;const active=deckBlend.active;advanceCameraJourney(p.duration,true);cancelDeckBlend();results.push({from,to,active,reused,clear:p.clear,arrived:cameraJourney===null});}return results;})()`);
Object.assign(report.checks,w.eval(`(()=>{sourceAt(11);focusRoom(12);advanceCameraJourney(cameraJourney.duration*.51);const sameDeck=!deckBlend.active;sourceAt(11);focusRoom(30);advanceCameraJourney(cameraJourney.duration*.51);renderer.render(scene,camera);renderDeckBlend(.08);const alpha=deckBlend.material.uniforms.alpha.value;focusRoom(20);const held=deckBlend.active&&deckBlend.material.uniforms.alpha.value===alpha;advanceCameraJourney(cameraJourney.duration*.51);const rapid=deckBlend.active&&deckBlend.material.uniforms.alpha.value===1;setMode('exterior');const canceled=!deckBlend.active;sourceAt(11);focusRoom(30);advanceCameraJourney(0,true);const reduced=!deckBlend.active;sourceAt(11);focusRoom(30);advanceCameraJourney(cameraJourney.duration*.51);const size=renderer.getSize(new THREE.Vector2());renderer.setSize(900,650);renderDeckBlend(.016);const resized=!deckBlend.active;renderer.setSize(size.x,size.y);return{sameDeckNoFade:sameDeck,interruptionKeepsFrame:held,rapidBlendRestarts:rapid,overviewCancels:canceled,reducedMotionSkips:reduced,resizeCancelsCleanly:resized,shaderErrors:renderer.info.programs.filter(p=>p.diagnostics?.runnable===false).length===0};})()`));report.status=Object.values(report.checks).every(Boolean)&&report.transitions.every(r=>r.active&&r.reused&&r.clear&&r.arrived)?'passed':'failed';}catch(e){report.error=String(e.stack||e);}out.textContent=JSON.stringify(report,null,2);done.hidden=false;};
document.querySelector('#fps').onclick=async()=>{done.hidden=true;let report={runs:[]};try{const w=await setup();w.__ftvModel.viewport({x:620,y:100,w:420,h:600});w.eval(`sea.update=()=>{};window.frames=0;const render=renderer.render.bind(renderer);renderer.render=(s,c)=>{if(s===scene)window.frames++;return render(s,c);};window.captureOriginal=captureDeckBlend;window.fadeMode=enabled=>{cancelDeckBlend();captureDeckBlend=enabled?window.captureOriginal:()=>{};};`);for(const after of [false,true,true,false]){w.__ftvPaused=true;w.eval('sourceAt(11)');w.fadeMode(after);w.__ftvPaused=false;await sleep(1200);let frames=0,elapsed=0;for(const id of ['20','30','35','11','20','30']){w.__ftvPaused=true;w.frames=0;const start=performance.now();w.__ftvModel.select(id);w.__ftvPaused=false;await sleep(1500);frames+=w.frames;elapsed+=performance.now()-start;}report.runs.push({after,fps:frames*1000/elapsed,...w.eval('({calls:renderer.info.render.calls,textures:renderer.info.memory.textures})')});out.textContent='Mesure '+report.runs.length+'/4';}const avg=after=>report.runs.filter(r=>r.after===after).reduce((s,r)=>s+r.fps,0)/2;report.performance={before:avg(false),after:avg(true),percent:(avg(true)/avg(false)-1)*100};report.status=report.performance.percent>-3?'passed':'failed';}catch(e){report.error=String(e.stack||e);}out.textContent=JSON.stringify(report,null,2);done.hidden=false;};</script>
