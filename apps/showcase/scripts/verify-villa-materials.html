<!doctype html><meta charset="utf-8"><title>Villa — comparaison matériaux</title>
<style>body{margin:0;font:14px system-ui;background:#edf0f2}canvas{width:100vw;height:80vh;display:block}nav{padding:8px}button{padding:10px;margin-right:8px}pre{white-space:pre-wrap;padding:12px;max-height:200px;overflow:auto}</style>
<nav><button id="before">Avant</button><button id="after">Après</button><button id="bench">Comparer les performances</button><select id="room"><option value="1">Salon</option><option value="6">Chambre 2</option><option value="2">Cuisine</option><option value="12">Piscine</option></select><button id="night">Jour / nuit</button></nav>
<canvas></canvas><pre id="result">Prêt</pre>
<script type="module">
const moduleURL='/plan3d/plan3d.js'; const {createPlan3D}=await import(/* @vite-ignore */ moduleURL);
const original=await (await fetch('/plan3d/villa-crans.json')).json();
const canvas=document.querySelector('canvas'),result=document.querySelector('#result');
let api,day=1,room=1,busy=false;
const errors=[];window.addEventListener('error',e=>errors.push(e.message));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function mount(refined){
  api?.dispose(); const config=structuredClone(original);if(!refined)delete config.materialFinish;
  api=createPlan3D({canvas,config,startOverview:false,environmentTime:()=>10});
  api.holdOverview(false);api.setRoom(room);api.jump();api.setDay(day);
  for(let c=0;c<5;c++)api.setCircuit(room,c,.7);
}
function resources(){return {...api.renderer.info.memory,programs:api.renderer.info.programs.length,...api.metrics()};}
document.querySelector('#before').onclick=()=>{if(!busy){mount(false);result.textContent='Avant — matériaux de référence';}};
document.querySelector('#after').onclick=()=>{if(!busy){mount(true);result.textContent='Après — matériaux affinés';}};
document.querySelector('#room').onchange=e=>{if(!busy){room=Number(e.target.value);api.setRoom(room);api.jump();for(let c=0;c<5;c++)api.setCircuit(room,c,.7);}};
document.querySelector('#night').onclick=()=>{day=1-day;api.setDay(day);};
document.querySelector('#bench').onclick=async()=>{
  busy=true;const report={runs:[],errors,viewport:[innerWidth,innerHeight],dpr:devicePixelRatio};
  try{
    room=1;day=1;
    for(const refined of [false,true,true,false,false,true,true,false]){
      result.textContent=`Mesure ${report.runs.length+1}/8 — ${refined?'après':'avant'}…`;
      mount(refined);await sleep(3000);
      const start=performance.now(),frames=api.metrics().renderedFrames;
      await sleep(3000);
      report.runs.push({refined,fps:(api.metrics().renderedFrames-frames)*1000/(performance.now()-start),...resources()});
    }
    // One moving bird may enter/leave the frustum between runs; allow one draw call.
    report.sameBudget=['triangles','drawCalls','textures','geometries','programs','pixelRatio'].every(k=>report.runs.every(r=>r[k]===report.runs[0][k]));
    report.rooms=[];
    mount(true);
    for(const id of Object.keys(api.rooms)){
      api.setRoom(Number(id));api.jump();await sleep(80);
      report.rooms.push({id,phase:api.navigation().phase});
    }
    report.colorAttributesComplete=Object.values(api.rooms).every(r=>{let ok=true;r.group.traverse(o=>{if(o.isMesh&&o.material.vertexColors&&!o.geometry.getAttribute('color'))ok=false;});return ok;});
    report.finiteUVs=Object.values(api.rooms).every(r=>{let ok=true;r.group.traverse(o=>{const a=o.geometry?.attributes.uv?.array;if(a)for(const n of a)if(!Number.isFinite(n))ok=false;});return ok;});
    const avg=flag=>report.runs.filter(r=>r.refined===flag).reduce((s,r)=>s+r.fps,0)/4; report.fpsChangePercent=(avg(true)/avg(false)-1)*100; report.sameDrawCalls=Math.max(...report.runs.filter(r=>r.refined).map(r=>r.drawCalls))<=Math.max(...report.runs.filter(r=>!r.refined).map(r=>r.drawCalls))+1; report.sameTextures=report.runs.every(r=>r.textures===report.runs[0].textures); report.status=report.sameDrawCalls&&report.sameTextures&&report.fpsChangePercent > -3 &&report.finiteUVs&&report.colorAttributesComplete&&!errors.length?'passed':'failed';
    room=6;mount(true);
  }catch(e){report.status='failed';report.error=String(e);}
  result.textContent=JSON.stringify(report,null,2);busy=false;
};
mount(true);
</script>
