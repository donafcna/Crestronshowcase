<!doctype html><meta charset="utf-8"><title>Yacht — trajets de caméra</title><button id="paths">Vérifier les trajets</button><button id="fps">Comparer la fluidité</button><pre id="report">Prêt</pre><iframe src="/ftv-luxury/models/yacht.html" style="width:1280px;height:800px"></iframe><script>
const out=document.querySelector('#report'),sleep=ms=>new Promise(r=>setTimeout(r,ms));let report={};async function setup(){const w=document.querySelector('iframe').contentWindow;for(let i=0;i<300&&!w.__ftvYachtExterior?.nightFinish;i++)await sleep(50);w.__ftvPaused=true;w.__ftvYachtExterior.setTestTime(45);w.eval(`window.snap=()=>{radius=desiredRadius;yaw=desiredYaw;pitch=desiredPitch;target.copy(desiredTarget);camera.position.set(target.x+Math.sin(yaw)*Math.cos(pitch)*radius,target.y+Math.sin(pitch)*radius,target.z+Math.cos(yaw)*Math.cos(pitch)*radius);camera.lookAt(target);camera.updateMatrixWorld();};window.sourceAt=id=>{setMode('deck',rooms[id].deck);focusRoom(id);cameraJourney=null;snap();};`);return w;}
document.querySelector('#paths').onclick=async()=>{try{const w=await setup();report={cases:0,lifted:0,failures:[],duration:{min:10,max:0},maxArrivalError:0};for(const view of (new URLSearchParams(location.search).has('interaction')?[]:[{x:0,y:0,w:1280,h:800},{x:620,y:100,w:420,h:600}])){w.__ftvModel.viewport(view);for(let from=0;from<37;from++){out.textContent='Format '+view.w+' : départ '+(from+1)+'/37';const r=w.eval(`(()=>{const results=[];for(let to=0;to<37;to++){if(to===${from})continue;sourceAt(${from});focusRoom(to);const p=cameraJourney;if(!p){results.push({to,error:'missing'});continue;}let collision=false,switchedEarly=false;const duration=p.duration;for(let i=0;i<120;i++){advanceCameraJourney(duration/120);camera.lookAt(target);camera.updateMatrixWorld();const boxes=(p.switched?p.destinationBoxes:p.sourceBoxes);if(boxes.some(b=>b.containsPoint(camera.position)))collision=true;if(p.switched&&i<58)switchedEarly=true;}advanceCameraJourney(.01);const endpoint=p.lookEnd.clone().add(new THREE.Vector3(Math.sin(p.endYaw)*Math.cos(p.endPitch),Math.sin(p.endPitch),Math.cos(p.endYaw)*Math.cos(p.endPitch)).multiplyScalar(p.endRadius));results.push({to,clear:p.clear,collision,switchedEarly,lifted:p.lifted,duration,error:camera.position.distanceTo(endpoint)});}return results;})()`);for(const item of r){report.cases++;if(item.lifted)report.lifted++;report.duration.min=Math.min(report.duration.min,item.duration);report.duration.max=Math.max(report.duration.max,item.duration);report.maxArrivalError=Math.max(report.maxArrivalError,item.error||0);if(!item.clear||item.collision||item.switchedEarly||item.error>1e-6)report.failures.push({view: view.w,from,...item});}await sleep(0);}}
report.interruption=w.eval(`(()=>{sourceAt(11);focusRoom(30);advanceCameraJourney(.25);camera.lookAt(target);camera.updateMatrixWorld();const prior=camera.position.clone();focusRoom(20);const continuous=cameraJourney.start.distanceTo(prior)<1e-9;const p=cameraJourney;advanceCameraJourney(p.duration,true);return{continuous,completed:cameraJourney===null,arrival:camera.position.distanceTo(p.end)};})()`);report.retarget=w.eval(`(()=>{sourceAt(11);focusRoom(30);advanceCameraJourney(.5);camera.lookAt(target);camera.updateMatrixWorld();const prior=camera.position.clone();__ftvModel.viewport({x:0,y:0,w:390,h:700});const p=cameraJourney;const continuous=camera.position.distanceTo(prior)<1e-9&&p.start.distanceTo(prior)<1e-9,clear=p.clear;advanceCameraJourney(p.duration,true);const resized=camera.position.distanceTo(p.end)<1e-9;sourceAt(11);focusRoom(30);advanceCameraJourney(.3);const q=camera.position.clone();focusRoom(30);const sameRoomContinuous=cameraJourney.start.distanceTo(q)<1e-9;setMode('exterior');return{continuous,clear,resized,sameRoomContinuous,canceled:cameraJourney===null};})()`);report.status=Object.values(report.retarget).every(Boolean)&&!report.failures.length&&report.interruption.continuous&&report.interruption.completed?'passed':'failed';}catch(e){report.error=String(e.stack||e);}out.textContent=JSON.stringify(report,null,2);};
document.querySelector('#fps').onclick=async()=>{try{const w=await setup();report={runs:[]};w.__ftvModel.viewport({x:620,y:100,w:420,h:600});w.eval(`sea.update=()=>{};window.ticks=0;const render=renderer.render.bind(renderer);renderer.render=(...a)=>{ticks++;return render(...a);};window.routeStep=advanceCameraJourney;window.planRoute=beginCameraJourney;window.pathMode=legacy=>{advanceCameraJourney=legacy?()=>false:window.routeStep;beginCameraJourney=legacy?()=>{}:window.planRoute;};`);for(const legacy of [true,false,false,true]){w.__ftvPaused=true;w.eval('sourceAt(11)');w.pathMode(legacy);w.__ftvPaused=false;await sleep(1500);let frames=0,elapsed=0;for(const id of ['12','18','30','20','35','11']){w.__ftvPaused=true;w.ticks=0;const start=performance.now();w.__ftvModel.select(id);w.__ftvPaused=false;await sleep(1800);frames+=w.ticks;elapsed+=performance.now()-start;}report.runs.push({legacy,fps:frames*1000/elapsed,...w.eval('({calls:renderer.info.render.calls,triangles:renderer.info.render.triangles,textures:renderer.info.memory.textures})')});out.textContent='Mesure '+report.runs.length+'/4';}
const avg=legacy=>report.runs.filter(r=>r.legacy===legacy).reduce((s,r)=>s+r.fps,0)/2;report.performance={before:avg(true),after:avg(false),percent:(avg(false)/avg(true)-1)*100};report.status=report.performance.percent>-3?'passed':'failed';}catch(e){report.error=String(e.stack||e);}out.textContent=JSON.stringify(report,null,2);};</script>
