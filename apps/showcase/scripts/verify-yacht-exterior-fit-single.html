<!doctype html><meta charset="utf-8"><title>Yacht — comparaison sur une même scène</title><style>body{font:14px system-ui;background:#102733;color:white}iframe{width:1280px;height:800px;border:0}pre{white-space:pre-wrap}button{padding:12px}</style><button id="run">Mesurer la même scène avant et après cadrage</button><pre id="report">Prêt</pre><iframe></iframe><script type="module">
const sleep=ms=>new Promise(r=>setTimeout(r,ms)),report={method:'single-context A/B/B/A, frozen environment and water',runs:[],errors:[]},frame=document.querySelector('iframe'),out=document.querySelector('#report');
document.querySelector('button').onclick=async()=>{try{
const old=await(await fetch('/yacht-fit-before.html')).text();let fn=old.slice(old.indexOf('const fitYacht=')+'const fitYacht='.length);fn=fn.slice(0,fn.indexOf(";let mode='exterior'"));
let source=await(await fetch('/ftv-luxury/models/yacht.html')).text();source=source.replace('<head>','<head><base href="/ftv-luxury/models/">').replace('const shift=0;','const shift=window.__oldShift?viewport.w*.075:0;');frame.srcdoc=source;
for(let i=0;i<400;i++){await sleep(50);if(frame.contentWindow.__ftvYachtExterior?.nightFinish)break;}const w=frame.contentWindow;w.addEventListener('error',e=>report.errors.push(e.message));w.eval('window.oldFit='+fn);w.__ftvYachtExterior.setTestTime(45);w.__ftvModel.viewport({x:620,y:100,w:420,h:600});w.eval(`auto=false;sea.update=()=>{};window.newRadius=desiredRadius;window.newTarget=desiredTarget.clone();window.counter=0;window.cpu=[];const priorRender=renderer.render.bind(renderer);renderer.render=function(...args){const t=performance.now();const result=priorRender(...args);window.cpu.push(performance.now()-t);window.counter++;return result;};`);
for(const after of [false,true,true,false]){out.textContent='Mesure '+(report.runs.length+1)+'/4';w.eval(`window.__oldShift=${!after};desiredRadius=${after?'window.newRadius':'window.oldFit()'};${after?'desiredTarget.copy(window.newTarget)':'desiredTarget.set(-1,10,0)'};radius=desiredRadius;target.copy(desiredTarget);`);await sleep(3500);w.eval('window.counter=0;window.cpu=[];');const start=performance.now();await sleep(6500);report.runs.push({after,fps:w.counter*1000/(performance.now()-start),...w.eval(`({calls:renderer.info.render.calls,triangles:renderer.info.render.triangles,...renderer.info.memory,cpuMedian:window.cpu.sort((a,b)=>a-b)[Math.floor(window.cpu.length*.5)],cpuP95:window.cpu[Math.floor(window.cpu.length*.95)]})`)});}
const avg=flag=>report.runs.filter(r=>r.after===flag).reduce((s,r)=>s+r.fps,0)/2;report.fpsChangePercent=(avg(true)/avg(false)-1)*100;report.status=report.fpsChangePercent>-3&&!report.errors.length?'passed':'failed';
}catch(e){report.errors.push(String(e));report.status='failed';}out.textContent=JSON.stringify(report,null,2);};
</script>
