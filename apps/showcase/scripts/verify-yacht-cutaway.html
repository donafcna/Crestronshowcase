<!doctype html><meta charset="utf-8"><title>Yacht — murs de premier plan</title><button id="run">Vérifier les murs de premier plan</button><pre id="report">Prêt</pre><div id="captures"></div><iframe id="model" src="/ftv-luxury/models/yacht.html" style="width:1280px;height:800px"></iframe><script>
const out=document.querySelector('#report'),sleep=ms=>new Promise(r=>setTimeout(r,ms));
document.querySelector('button').onclick=async()=>{const report={cabins:[],runs:[]};try{const w=document.querySelector('iframe').contentWindow;for(let i=0;i<300&&!w.__ftvYachtExterior?.nightFinish;i++)await sleep(50);w.__ftvYachtExterior.setTestTime(45);w.__ftvPaused=true;w.__ftvModel.viewport({x:0,y:0,w:1280,h:800});
w.eval("window.testBeforeFit=function(r){\n const v=window.__ftvViewport,aspect=v?v.w/v.h:innerWidth/innerHeight;\n const c=new THREE.PerspectiveCamera(camera.fov,aspect,.12,900),dir=new THREE.Vector3(Math.sin(desiredYaw)*Math.cos(desiredPitch),Math.sin(desiredPitch),Math.cos(desiredYaw)*Math.cos(desiredPitch));\n const p=new THREE.Vector3(),points=['bed','owner','crew'].includes(r.type)?roomFitPoints(r):null;let hi=100;\n if(points)desiredTarget.set(r.x,decks[r.deck].position.y+.85,r.z);\n // Recenter actual cabin bounds in the camera plane, then fit once more for safety.\n for(let pass=0;pass<(points?4:1);pass++){\n let lo=5;hi=100;\n for(let i=0;i<17;i++){const distance=(lo+hi)/2;c.position.copy(desiredTarget).addScaledVector(dir,distance);c.lookAt(desiredTarget);c.updateMatrixWorld();let extent=0;if(points){for(let j=0;j<points.length;j+=3){p.set(r.x+points[j],decks[r.deck].position.y+points[j+1],r.z+points[j+2]).project(c);extent=Math.max(extent,Math.abs(p.x),Math.abs(p.y));}}else for(const x of [-r.l/2,r.l/2])for(const y of [0,2.8])for(const z of [-r.w/2,r.w/2]){p.set(r.x+x,decks[r.deck].position.y+y,r.z+z).project(c);extent=Math.max(extent,Math.abs(p.x),Math.abs(p.y));}if(extent>.975)lo=distance;else hi=distance;}\n if(points&&pass<3){let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;\n for(let j=0;j<points.length;j+=3){p.set(r.x+points[j],decks[r.deck].position.y+points[j+1],r.z+points[j+2]).project(c);minX=Math.min(minX,p.x);maxX=Math.max(maxX,p.x);minY=Math.min(minY,p.y);maxY=Math.max(maxY,p.y);}\n const span=hi*Math.tan(THREE.MathUtils.degToRad(camera.fov)/2);\n desiredTarget.addScaledVector(new THREE.Vector3().setFromMatrixColumn(c.matrixWorld,0),(minX+maxX)*.5*span*aspect).addScaledVector(new THREE.Vector3().setFromMatrixColumn(c.matrixWorld,1),(minY+maxY)*.5*span);\n }\n }\n return hi;\n}\n");
w.eval(`window.testSnap=()=>{radius=desiredRadius;yaw=desiredYaw;pitch=desiredPitch;target.copy(desiredTarget);camera.position.set(target.x+Math.sin(yaw)*Math.cos(pitch)*radius,target.y+Math.sin(pitch)*radius,target.z+Math.cos(yaw)*Math.cos(pitch)*radius);camera.lookAt(target);const v=window.__ftvViewport;camera.setViewOffset(v.w,v.h,-v.x,-v.y,innerWidth,innerHeight);camera.updateMatrixWorld();renderer.render(scene,camera);};window.testAngle=before=>{restoreRoomWalls(cutawayRoom);cutawayRoom=null;cutawayMask=-1;if(!before)setRoomCutaway(selectedRoom);testSnap();updateRoomCutaway();renderer.render(scene,camera);};`);
const capture=id=>{const im=document.createElement('img');im.id=id;im.style.width='48%';im.src=w.__yacht.renderer.domElement.toDataURL('image/jpeg',.75);document.querySelector('#captures').append(im);};
for(const view of [{x:0,y:0,w:1280,h:800},{x:620,y:100,w:420,h:600},{x:0,y:0,w:390,h:700},{x:0,y:0,w:900,h:700}]){w.__ftvModel.viewport(view);for(const r of w.__yacht.rooms){w.__ftvModel.select(r.id);const values=[];for(const before of [true,false]){w.testAngle(before);if([11,20,30].includes(r.id)&&view.w===1280)capture((before?'before-':'after-')+r.id);values.push(w.eval(`(()=>{const pillows=[],heads=[];selectedRoom.g.traverse(o=>{if(o.userData.softBox?.kind==='pillow')pillows.push(o);if(o.userData.softBox?.kind==='headboard')heads.push(o);});let hidden=0;for(const p of pillows){const center=p.getWorldPosition(new THREE.Vector3()),delta=center.clone().sub(camera.position),ray=new THREE.Raycaster(camera.position,delta.clone().normalize(),0,delta.length()-.01);if(ray.intersectObjects(heads).length)hidden++;}let extent=0;const q=new THREE.Vector3();selectedRoom.g.traverse(o=>{if(!o.isMesh||o.material?.visible===false)return;const b=o.geometry.boundingBox;for(const x of [b.min.x,b.max.x])for(const y of [b.min.y,b.max.y])for(const z of [b.min.z,b.max.z]){q.set(x,y,z).applyMatrix4(o.matrixWorld).project(camera);const v=window.__ftvViewport;const sx=(q.x+1)*innerWidth/2,sy=(1-q.y)*innerHeight/2;extent=Math.max(extent,Math.abs((sx-v.x)/v.w*2-1),Math.abs((sy-v.y)/v.h*2-1));}});const otherWallsRestored=rooms.filter(r=>r!==selectedRoom).every(r=>r.wallSides.every(s=>s.parts.every(p=>p.o.position.y===p.y&&p.o.scale.y===p.sy&&p.o.visible===p.visible)));const lowered=selectedRoom.wallSides.flatMap(s=>s.parts).filter(p=>p.o.scale.y<p.sy).length;return{otherWallsRestored,lowered,extent,hidden,pillows:pillows.length,radius:desiredRadius,pitch:desiredPitch,yaw:desiredYaw,failed:renderer.info.programs.filter(p=>p.diagnostics?.runnable===false).length};})()`));}report.cabins.push({id:r.id,name:r.name,view,before:values[0],after:values[1]});}}
for(const subject of ['11','20','30']){w.__ftvModel.select(subject);w.__ftvModel.viewport({x:620,y:100,w:420,h:600});w.eval(`sea.update=()=>{};if(!window.countRender){window.countRender=renderer.render.bind(renderer);renderer.render=(...args)=>{window.count++;return window.countRender(...args);};}window.count=0;`);w.__ftvPaused=false;
for(const before of [true,false,false,true]){out.textContent='Espace '+subject+' : mesure '+(report.runs.length%4+1)+'/4';w.testAngle(before);await sleep(1200);w.count=0;const start=performance.now();await sleep(4000);report.runs.push({subject,before,fps:w.count*1000/(performance.now()-start),...w.eval('({calls:renderer.info.render.calls,triangles:renderer.info.render.triangles,textures:renderer.info.memory.textures})')});}
}
const avg=before=>{const rs=report.runs.filter(r=>r.before===before);return rs.reduce((s,r)=>s+r.fps,0)/rs.length;};report.performance={before:avg(true),after:avg(false),percent:(avg(false)/avg(true)-1)*100};report.status=report.cabins.every(r=>r.after.hidden===0&&!r.after.failed&&r.after.extent<.976&&r.after.pitch===r.before.pitch&&r.after.otherWallsRestored)&&report.performance.percent>-3?'passed':'failed';
}catch(e){report.error=String(e.stack||e);}out.textContent=JSON.stringify(report,null,2);};</script>
