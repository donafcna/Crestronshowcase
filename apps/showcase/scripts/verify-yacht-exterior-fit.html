<!doctype html><meta charset="utf-8"><title>Yacht — cadrage extérieur</title><style>body{margin:0;background:#102733;color:white;font:14px system-ui}iframe{width:1280px;height:800px;border:0}button{padding:12px}pre{white-space:pre-wrap}img{width:48%}</style><button id="run">Comparer le cadrage et la fluidité</button><pre id="report">Prêt</pre><div id="view"></div><div id="captures"></div>
<script type="module">
const report={fits:[],runs:[],errors:[]},out=document.querySelector('#report'),view=document.querySelector('#view'),sleep=ms=>new Promise(r=>setTimeout(r,ms));let frame;
const profiles=[{x:620,y:100,w:420,h:600},{x:350,y:80,w:700,h:620},{x:80,y:60,w:1100,h:680},{x:0,y:80,w:440,h:600}];
async function mount(after){if(frame){frame.contentWindow.__yacht?.renderer.dispose();frame.contentWindow.__yacht?.renderer.forceContextLoss();frame.remove();}frame=document.createElement('iframe');frame.src=after?'/ftv-luxury/models/yacht.html':'/yacht-fit-before.html';view.append(frame);for(let i=0;i<400;i++){await sleep(50);if(frame.contentWindow.__ftvYachtExterior?.nightFinish)break;}const w=frame.contentWindow;if(!w.__ftvYachtExterior?.nightFinish)throw Error('initialisation');w.addEventListener('error',e=>report.errors.push(e.message));w.__ftvYachtExterior.setTestTime(45);w.__ftvModel.overview();return w;}
function pose(w,v,after){w.__ftvModel.viewport(v);return w.eval(`(()=>{yaw=desiredYaw;pitch=desiredPitch;radius=desiredRadius;target.copy(desiredTarget);camera.position.copy(target).add(new THREE.Vector3(Math.sin(yaw)*Math.cos(pitch),Math.sin(pitch),Math.cos(yaw)*Math.cos(pitch)).multiplyScalar(radius));camera.lookAt(target);const v=${JSON.stringify(v)};camera.setViewOffset(v.w,v.h,-v.x-${after?0:'v.w*.075'},-v.y,innerWidth,innerHeight);camera.updateMatrixWorld();renderer.render(scene,camera);exterior.updateWorldMatrix(true,true);let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;const p=new THREE.Vector3();exterior.traverse(o=>{if(!o.isMesh||o.isInstancedMesh||!o.geometry||o.material?.transparent||o.material?.isShaderMaterial)return;for(let parent=o;parent&&parent!==exterior;parent=parent.parent)if(parent===window.__ftvYachtExterior?.root)return;if(!o.geometry.boundingBox)o.geometry.computeBoundingBox();const b=o.geometry.boundingBox;for(const x of [b.min.x,b.max.x])for(const y of [b.min.y,b.max.y])for(const z of [b.min.z,b.max.z]){p.set(x,y,z).applyMatrix4(o.matrixWorld);p.y=Math.max(-1.5,p.y);p.project(camera);const sx=(p.x*.5+.5)*innerWidth,sy=(-p.y*.5+.5)*innerHeight;minX=Math.min(minX,sx);maxX=Math.max(maxX,sx);minY=Math.min(minY,sy);maxY=Math.max(maxY,sy);}});return{radius,bounds:{minX,maxX,minY,maxY},width:(maxX-minX)/v.w,height:(maxY-minY)/v.h,inside:minX>=v.x&&maxX<=v.x+v.w&&minY>=v.y&&maxY<=v.y+v.h,failed:renderer.info.programs.filter(p=>p.diagnostics?.runnable===false).length};})()`);}
document.querySelector('#run').onclick=async()=>{try{
for(const after of [false,true,true,false]){out.textContent='Mesure '+(report.runs.length+1)+'/4';const w=await mount(after);for(const v of profiles)report.fits.push({after,profile:v,...pose(w,v,after)});pose(w,profiles[0],after);await sleep(4500);w.eval(`window.measured=0;window.prior=scene.onBeforeRender;scene.onBeforeRender=function(...args){window.prior?.apply(this,args);window.measured++;};`);const t=performance.now();await sleep(6000);const data=w.eval(`({frames:measured,calls:renderer.info.render.calls,triangles:renderer.info.render.triangles,...renderer.info.memory})`);report.runs.push({after,fps:data.frames*1000/(performance.now()-t),...data});if(report.runs.length<=2){w.__ftvPaused=true;pose(w,profiles[0],after);const image=document.createElement('img');image.id=after?'after':'before';image.src=w.__yacht.renderer.domElement.toDataURL('image/png');document.querySelector('#captures').append(image);}}
const avg=flag=>report.runs.filter(r=>r.after===flag).reduce((s,r)=>s+r.fps,0)/2;report.fpsChangePercent=(avg(true)/avg(false)-1)*100;report.enlargement=profiles.map((v,i)=>({profile:v,widthPercent:(report.fits[4+i].width/report.fits[i].width-1)*100}));report.status=report.fits.filter(f=>f.after).every(f=>f.inside&&!f.failed)&&report.enlargement.every(e=>e.widthPercent>0)&&report.fpsChangePercent>-3&&!report.errors.length?'passed':'failed';
}catch(e){report.errors.push(String(e));report.status='failed';}out.textContent=JSON.stringify(report,null,2);};
</script>
