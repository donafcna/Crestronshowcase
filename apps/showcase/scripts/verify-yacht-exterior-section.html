<!doctype html><meta charset="utf-8"><title>Yacht — commandes Extérieur</title><button id="run">Vérifier les commandes extérieures et le zoom</button><pre id="report">Prêt</pre><iframe id="gui" style="width:440px;height:863px"></iframe><script type="module">
const sleep=ms=>new Promise(r=>setTimeout(r,ms)),report={checks:[],errors:[]},out=document.querySelector('#report'),frame=document.querySelector('iframe');
async function wait(test){for(let i=0;i<3000;i++){if(test())return;await sleep(50);}throw Error('Délai dépassé');}
const change=(el,value)=>{el.value=value;el.dispatchEvent(new Event('change',{bubbles:true}));};
document.querySelector('#run').onclick=async()=>{try{
frame.src='/ftv-luxury/gui.html?project=yacht-monaco&device=phone&tab3d=1';await wait(()=>frame.contentWindow.ftvYachtExteriorGui?.ready);const w=frame.contentWindow,d=w.document,model=d.querySelector('#model').contentWindow;w.addEventListener('error',e=>report.errors.push(e.message));
change(d.querySelector('#zone'),'exterior');await wait(()=>!d.querySelector('.yacht-exterior-panel').hidden);report.open={value:d.querySelector('#zone').value,view:model.__ftvModel.state().view};
const ids=[];for(const option of [...d.querySelector('[data-exterior-group]').options]){change(d.querySelector('[data-exterior-group]'),option.value);for(let i=0;i<20;i++){ids.push(...[...d.querySelectorAll('[data-exterior-id]')].map(el=>el.dataset.exteriorId));const next=d.querySelector('[data-exterior-page="1"]');if(next.disabled)break;next.click();}}
report.circuits={count:ids.length,unique:new Set(ids).size,missing:w.FTV_YACHT_EXTERIOR.circuits.filter(c=>!ids.includes(c.id)).map(c=>c.id)};
for(const [family,id,value]of [['underwater','underwater_port',23],['mast','mast_uplight',61],['decks','led_main',47]]){change(d.querySelector('[data-exterior-group]'),family);for(let i=0;i<10&&!d.querySelector('[data-exterior-id="'+id+'"]');i++)d.querySelector('[data-exterior-page="1"]').click();const input=d.querySelector('[data-exterior-id="'+id+'"]');input.focus();out.textContent='Régler '+id+' à '+value+' % au clavier.';await wait(()=>model.__ftvYachtExterior.inspect().state.levels[id]===value);report.checks.push({id,value,automatic:model.__ftvYachtExterior.inspect().state.automatic});}
const state=model.__ftvYachtExterior.inspect().state;report.independent=state.levels.underwater_port===23&&state.levels.mast_uplight===61&&state.levels.led_main===47;
d.querySelector('[data-exterior-preset="off"]').click();await wait(()=>Object.values(model.__ftvYachtExterior.inspect().state.levels).every(v=>v===0));report.off=true;
d.querySelector('[data-exterior-preset="night"]').click();await wait(()=>Object.values(model.__ftvYachtExterior.inspect().state.levels).every(v=>v>0));report.on=true;
change(d.querySelector('#zone'),'11');report.interior=!d.querySelector('#app').classList.contains('yacht-exterior-active')&&d.querySelector('#zone').value==='11';
change(d.querySelector('#zone'),'exterior');d.querySelector('[data-exterior-auto]').checked=true;d.querySelector('[data-exterior-auto]').dispatchEvent(new Event('change',{bubbles:true}));await wait(()=>model.__ftvYachtExterior.inspect().state.automatic);report.auto=true;
const cases=[];model.__ftvPaused=true;for(const r of model.__ftvModel.catalog){model.__ftvModel.select(r.id);cases.push(model.eval(`(()=>{const r=selectedRoom,v=new THREE.Vector3();let max=0;const c=new THREE.PerspectiveCamera(camera.fov,innerWidth/innerHeight,.12,900);c.position.copy(desiredTarget).add(new THREE.Vector3(Math.sin(desiredYaw)*Math.cos(desiredPitch),Math.sin(desiredPitch),Math.cos(desiredYaw)*Math.cos(desiredPitch)).multiplyScalar(desiredRadius));c.lookAt(desiredTarget);c.updateMatrixWorld();for(const x of [-r.l/2,r.l/2])for(const y of [0,2.8])for(const z of [-r.w/2,r.w/2]){v.set(r.x+x,decks[r.deck].position.y+y,r.z+z).project(c);max=Math.max(max,Math.abs(v.x),Math.abs(v.y));}return{id:r.id,extent:max};})()`));}report.zoom={rooms:cases.length,max:Math.max(...cases.map(c=>c.extent))};
report.status=report.open.value==='exterior'&&report.open.view==='exterior'&&report.circuits.unique===40&&report.circuits.count===40&&!report.circuits.missing.length&&report.independent&&report.interior&&report.auto&&report.zoom.max<.98&&!report.errors.length?'passed':'failed';
}catch(e){report.errors.push(String(e));report.status='failed';}out.textContent=JSON.stringify(report,null,2);};
</script>
