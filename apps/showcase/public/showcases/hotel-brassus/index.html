<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="ch5/favicon.ico"><title>Hotel Brassus · Hôtel des Horlogers</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;font:16px system-ui;color:#f6f3e9;background:#142720}body{display:flex;flex-direction:column}header{display:flex;align-items:center;gap:12px;padding:8px 14px;min-height:60px;background:#142720}strong{margin-right:auto;font-size:17px}small{display:block;font-size:11px;font-weight:400;color:#d7dfd9}select,button{font:inherit;min-height:42px;border:1px solid #75897e;border-radius:7px;padding:7px 12px;color:#fff;background:#223c30;cursor:pointer}button[aria-pressed=true]{background:#e4d197;color:#142720;border-color:#e4d197}main{flex:1;position:relative;min-height:0}iframe{border:0;width:100%;height:100%;position:absolute;inset:0;background:#f8f8f8}iframe[hidden]{display:none}@media(max-width:720px){header{gap:5px;padding:5px;flex-wrap:wrap}strong{font-size:14px}select,button{font-size:13px;padding:5px 7px}small{display:none}}
</style></head><body>
<header><strong>Hotel Brassus<small>Hôtel des Horlogers · Démonstration</small></strong><select id="zone" aria-label="Espace"><option value="bar">Bar</option><option value="entrance">Entrée / Lobby</option><option value="restaurant">Restaurant</option><option value="salon">Petit salon</option><option value="pdr">Salle privée</option><option value="wellness">Wellness</option><option value="seminar">Séminaires</option></select><select id="theme" aria-label="Thème du GUI"><option value="actuel">Original</option><option value="clair">Clair</option><option value="sombre">Sombre</option></select><button id="gui-tab" aria-pressed="true">Interface</button><button id="model-tab" aria-pressed="false">Maquette 3D</button></header>
<main><iframe id="gui" title="GUI CH5 Hôtel des Horlogers" sandbox="allow-scripts allow-same-origin"></iframe><iframe id="model" title="Maquette 3D de l’Hôtel des Horlogers" hidden></iframe></main>
<script>
const gui=document.getElementById('gui'),model=document.getElementById('model'),zone=document.getElementById('zone'),theme=document.getElementById('theme');
function load(){gui.src='ch5/index.html?zone='+zone.value+'&theme='+theme.value+'&nolock=1';model.contentWindow.postMessage({channel:'hdh-view',zone:zone.value},location.origin)}
zone.onchange=load;theme.onchange=load;
function view(isModel){if(isModel&&!model.getAttribute("src"))model.src="model.html";gui.hidden=isModel;model.hidden=!isModel;document.getElementById('gui-tab').setAttribute('aria-pressed',!isModel);document.getElementById('model-tab').setAttribute('aria-pressed',isModel);model.contentWindow.postMessage({channel:'hdh-view',visible:isModel,zone:zone.value},location.origin)}
document.getElementById('gui-tab').onclick=()=>view(false);document.getElementById('model-tab').onclick=()=>view(true);
window.addEventListener('message',e=>{if(e.origin!==location.origin)return;if(e.source===gui.contentWindow&&e.data?.channel==='hdh-demo')model.contentWindow.postMessage(e.data,location.origin)});load();
</script></body></html>
