(()=>{'use strict';const T=THREE,canvas=document.getElementById('c'),renderer=new T.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;

for(let x=-6.5;x<=6.5;x+=1.85){cyl(building,x,.75,-5.25,.13,1.15,M.black);cyl(building,x,1.34,-5.25,.46,.14,M.cream)}

const tableGroups={ground:new T.Group(),private:new T.Group(),rooftop:new T.Group(),terrace:new T.Group(),bar:new T.Group()};Object.values(tableGroups).forEach(g=>building.add(g));
function chair(g,x,z,rot=0,y=0){const q=new T.Group();q.position.set(x,y,z);q.rotation.y=rot;g.add(q);cyl(q,0,.46,0,.07,.85,M.black);box(q,0,.85,0,.72,.16,.72,M.cream);box(q,0,1.22,-.28,.72,.75,.14,M.cream)}

for(const x of [-13.8,13.8])for(const z of [-9.5,2.5])box(building,x,9,z,.32,5.4,.32,M.black);for(const z of [-9.5,2.5]){box(building,0,11.6,z,28,.35,.35,M.black);for(let x=-13;x<=13;x+=1.25)box(building,x,11.42,-3.5,.18,.22,12,M.wood)}
box(building,7.5,7.45,-7.6,12,1.55,1.7,M.black);box(building,7.5,8.28,-6.72,12,.1,.15,glow.bar);for(let x=2.5;x<=12.5;x+=1.8)chair(tableGroups.bar,x,-5.8,0,6.25);
for(const p of [[-9,-6],[-4,-6],[-9,-1],[-4,-1],[2,3],[8,3],[-8,7],[0,7],[8,7]])table(tableGroups.rooftop,...p,2.3,1.55,6.25);

// Planters and small trees.
function plant(x,y,z,scale=1){box(building,x,y+.35,z,1.25*scale,.7,1.25*scale,M.black);const trunk=cyl(building,x,y+1.8,z,.12*scale,2.8*scale,M.wood);for(let i=0;i<8;i++){const a=i/8*Math.PI*2,o=mesh(building,new T.SphereGeometry(1,12,8),M.green,x+Math.cos(a)*.55*scale,y+3.1*scale+Math.sin(i)*.25,z+Math.sin(a)*.55*scale,.6*scale,.9*scale,.6*scale);o.castShadow=true}cyl(building,x,y+.78,z,.11,.18,glow.plants)}
for(const p of [[-13,6.5,-9],[-13,6.5,9],[13,6.5,9],[13,6.5,-2],[-5,6.5,9],[5,6.5,9]])plant(...p,p[2]===9?.72:.9);
// Pendant lights and architectural strips.
const lights=[];function pendant(x,y,z,group='tables'){box(building,x,y,z,.08,1.15,.08,M.black);const shade=mesh(building,new T.ConeGeometry(.42,.48,20,1,true),M.black,x,y-.72,z);shade.rotation.x=Math.PI;const bulb=cyl(building,x,y-.87,z,.12,.22,glow[group]);const p=new T.PointLight(group==='pergola'?0xffbb73:0xffd19a,2.5,7,1.8);p.position.set(x,y-.9,z);building.add(p);lights.push({p,group})}
for(const p of [[-9,4], [0,4],[9,4],[-9,8],[0,8],[9,8],[0,0]])pendant(p[0],5.3,p[1]);for(const x of [-10,-5,0,5,10])pendant(x,11.25,-3.5,'pergola');
const zones={ground:{target:[0,1.7,3],pos:[31,24,36]},bar:{target:[0,2,-7],pos:[25,15,20]},private:{target:[11,2,-3],pos:[27,13,11]},rooftop:{target:[0,7,-1],pos:[32,27,35]},terrace:{target:[0,7,6],pos:[30,20,33]}};let current='ground',target=new T.Vector3(0,3,0),desiredTarget=target.clone(),desiredPos=new T.Vector3(38,31,42);camera.position.copy(desiredPos);
function focus(id){current=zones[id]?id:'ground';const v=zones[current];desiredTarget.set(...v.target);desiredPos.set(...v.pos)}function applyLevels(v={}){for(const k of Object.keys(glow)){const n=Number.isFinite(v[k])?v[k]:60;glow[k].emissiveIntensity=.05+n/100*3.1}for(const l of lights){const n=Number.isFinite(v[l.group])?v[l.group]:60;l.p.intensity=.1+n/100*3.8}}
