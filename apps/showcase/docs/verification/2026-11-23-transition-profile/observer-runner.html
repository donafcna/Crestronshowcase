<!doctype html><meta charset="utf-8"><title>Test chargements observateurs</title><button id="run">Tester 12 chargements</button><pre id="result">Prêt</pre><div id="slot"></div><script>
const records=[],runs=[],summaries=[];addEventListener('message',e=>{if(e.data?.observerDiagnostic)records.push(e.data.observerDiagnostic);if(e.data?.observerSummary)summaries.push(e.data.observerSummary)});document.querySelector('#run').onclick=async()=>{for(let i=0;i<12;i++){const f=document.createElement('iframe');f.style='width:440px;height:700px';f.src='http://127.0.0.1:4344/showcases/villa-gemini-frequencetv/iphone.html?observerRun='+i;document.querySelector('#slot').replaceChildren(f);await new Promise(r=>setTimeout(r,i%4===0?200:3200));runs.push({i,interrupted:i%4===0});document.querySelector('#result').textContent=JSON.stringify({runs,records,summaries});}document.querySelector('#result').textContent=JSON.stringify({status:'complete',runs,records,summaries});};</script>
