<!doctype html><meta charset="utf-8"><title>Test chargements observateurs</title><button id="run">Tester 4 chargements complets</button><pre id="result">Prêt</pre><div id="slot"></div><script>
const records=[],runs=[],summaries=[];addEventListener('message',e=>{if(e.data?.observerDiagnostic)records.push(e.data.observerDiagnostic);if(e.data?.observerSummary)summaries.push(e.data.observerSummary)});document.querySelector('#run').onclick=async()=>{for(let i=0;i<4;i++){const f=document.createElement('iframe');f.style='width:440px;height:700px';f.src='http://127.0.0.1:4344/showcases/villa-gemini-frequencetv/iphone.html?observerRun='+i;const loaded=new Promise(r=>{f.onload=()=>r('load');setTimeout(()=>r('timeout'),15000)});document.querySelector('#slot').replaceChildren(f);const state=await loaded;await new Promise(r=>setTimeout(r,2500));runs.push({i,state});document.querySelector('#result').textContent=JSON.stringify({runs,records,summaries});}document.querySelector('#result').textContent=JSON.stringify({status:'complete',runs,records,summaries});};</script>
