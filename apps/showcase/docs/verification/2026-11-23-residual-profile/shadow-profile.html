<!doctype html><meta charset="utf-8"><style>body{margin:0;background:#17202b;color:white;font:14px sans-serif}canvas{display:block;width:100vw;height:calc(100vh - 55px)}button{padding:8px}pre{white-space:pre-wrap}</style><button id="bench">Comparer les ombres</button><button id="before">Image avant</button><button id="after">Image après</button><span id="status">Prêt</span><canvas></canvas><pre id="result" hidden></pre><script type="module">
import {createPlan3D as base} from '/plan3d/plan3d.js';import {createPlan3D as stable} from '/plan3d/plan3d-stable-experiment.js';const cfg=await(await fetch('/plan3d/villa-crans.json')).json(),canvas=document.querySelector('canvas'),status=document.querySelector('#status'),out=document.querySelector('#result');let api;const sleep=t=>new Promise(r=>setTimeout(r,t));function mount(flag){api?.dispose();api=(flag?stable:base)({canvas,config:structuredClone(cfg),startOverview:true,environmentTime:()=>10});api.setDay(1);}async function sample(ms){const t=performance.now(),first=api.metrics().renderedFrames,intervals=[];let last=first,stamp=t;await new Promise(resolve=>{function tick(){const now=performance.now(),n=api.metrics().renderedFrames;if(n!==last){intervals.push((now-stamp)/(n-last));stamp=now;last=n;}if(now-t>=ms)resolve();else requestAnimationFrame(tick)}requestAnimationFrame(tick)});return {fps:(api.metrics().renderedFrames-first)*1000/(performance.now()-t),max:Math.max(...intervals),programs:api.renderer.info.programs.length};}
document.querySelector('#bench').onclick=async()=>{const runs=[];for(const flag of [false,true,false,true]){mount(flag);await sleep(2500);const before=api.renderer.info.programs.length,orig=api.renderer.render,events=[];api.renderer.render=function(s,c){const t=performance.now(),n=this.info.programs.length;try{return orig.call(this,s,c)}finally{const ms=performance.now()-t;if(ms>4)events.push({ms,added:this.info.programs.length-n});}};api.holdOverview(false);api.setRoom(6);api.setVideoSource(6,2);const opening=await sample(4000);api.renderer.render=orig;runs.push({stable:flag,before,opening,events});status.textContent='Mesure '+runs.length+'/4';out.textContent=JSON.stringify({runs});}status.textContent='Terminé';};for(const [id,flag] of [['before',false],['after',true]])document.querySelector('#'+id).onclick=async()=>{mount(flag);api.holdOverview(false);api.setRoom(6);api.jump();api.setVideoSource(6,2);api.remote('pause');api.rooms[6].tv.screen.st.tick=90;for(let i=0;i<5;i++)api.setCircuit(6,i,.7);await sleep(3300);status.textContent='Image '+id+' prête';};mount(false);
</script>
