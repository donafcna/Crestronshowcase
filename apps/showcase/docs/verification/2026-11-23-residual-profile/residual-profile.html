<!doctype html><meta charset="utf-8"><title>Course — matériaux dans la villa</title>
<style>*{box-sizing:border-box}body{overflow-x:hidden;margin:0;background:#16202a;color:#eff3f6;font:14px system-ui}nav{height:54px;display:flex;align-items:center;gap:12px;padding:0 18px}button,select{font:inherit;padding:8px;border:0;border-radius:5px}canvas{display:block;width:100vw;height:calc(100vh - 100px)}#status{padding:12px}pre{white-space:pre-wrap}#result{max-height:260px;overflow:auto}</style>
<nav><strong>Villa • matériaux du circuit</strong><button id="before">Avant</button><button id="after">Après</button><select id="room"><option value="8">Home Cinéma</option><option value="12">Piscine & Spa</option><option value="13">Sauna & Hammam</option><option value="15">Garage & Ateliers</option><option value="16">Simulateur de golf</option><option value="17">Local technique</option></select><button id="day">Jour / nuit</button><button id="off">OFF</button><button id="on">TOTAL</button><button id="validate">Vérifier géométries</button><button id="sauna">Contrôler golf</button><button id="bench">Mesurer avant/après</button></nav><canvas></canvas><div id="status">Chargement…</div><pre id="result"></pre>
<script type="module">
import * as T from '/plan3d/vendor/three.module.min.js';
import {createPlan3D} from '/plan3d/plan3d.js';
const cfg=await(await fetch('/plan3d/villa-crans.json')).json(),canvas=document.querySelector('canvas'),status=document.querySelector('#status'),out=document.querySelector('#result');
const names={11:'Pool House',12:'Piscine & Spa',13:'Sauna & Hammam',15:'Garage & Ateliers',16:'Simulateur de golf',17:'Local technique'};cfg.pieces.forEach(p=>{if(names[p.id])p.nom=names[p.id];});
let api,room=8,refined=true,day=1,busy=false,readyTimer;const errors=[];addEventListener('error',e=>errors.push(e.message));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function ready(){clearTimeout(readyTimer);status.textContent='Stabilisation…';readyTimer=setTimeout(()=>{if(!busy)status.textContent=(refined?'APRÈS':'AVANT')+' — prêt — caméra et lumière identiques';},3500);}
function mount(flag){api?.dispose();canvas.width=1;canvas.height=1;refined=flag;const config=structuredClone(cfg);config.specialFinish=true;config.specialPolish=true;config.raceBroadcast=true;config.raceMaterials=true;config.visibleRoomMatrices=true;config.pooledTvLight=flag;api=createPlan3D({canvas,config,startOverview:false,environmentTime:()=>10});api.holdOverview(false);api.setRoom(room);api.jump();api.setDay(day);api.setVideoSource(room,2);for(let c=0;c<5;c++)api.setCircuit(room,c,.7);status.textContent=(flag?'APRÈS':'AVANT')+' — même caméra, éclairage 70 %, jour/nuit fixe';ready();}
function levels(v){for(let c=0;c<5;c++)api.setCircuit(room,c,v);}
for(const [id,flag] of [['before',false],['after',true]])document.querySelector('#'+id).onclick=()=>{if(!busy)mount(flag);};
document.querySelector('#room').onchange=e=>{if(busy)return;room=Number(e.target.value);api.setRoom(room);api.jump();levels(.7);ready();};
document.querySelector('#day').onclick=()=>{day=1-day;api.setDay(day);ready();};document.querySelector('#off').onclick=()=>levels(0);document.querySelector('#on').onclick=()=>levels(1);
async function sample(ms){const start=performance.now(),first=api.metrics().renderedFrames;let last=first,stamp=start;const intervals=[];let moving=0;await new Promise(resolve=>{function tick(){const now=performance.now(),n=api.metrics().renderedFrames;if(n!==last){intervals.push((now-stamp)/(n-last));stamp=now;last=n;}if(api.navigation().moving)moving++;if(now-start>=ms)resolve();else requestAnimationFrame(tick);}requestAnimationFrame(tick);});const a=intervals.sort((a,b)=>a-b);return {fps:(api.metrics().renderedFrames-first)*1000/(performance.now()-start),sampledMedianMs:a[Math.floor(a.length*.5)],sampledP95Ms:a[Math.floor(a.length*.95)],maxMs:a.at(-1),movingSamples:moving,...api.metrics(),...api.renderer.info.memory,programs:api.renderer.info.programs.length};}
document.querySelector('#validate').onclick=()=>{const issues=[];for(const r of Object.values(api.rooms))r.group.traverse(o=>{if(o.isMesh&&o.material.vertexColors&&!o.geometry.attributes.color)issues.push({room:r.id,name:o.name,issue:'missing color'});for(const [key,a] of Object.entries(o.geometry?.attributes||{}))if(Array.from(a.array).some(n=>!Number.isFinite(n)))issues.push({room:r.id,name:o.name,issue:key,geometry:o.geometry.type});});out.textContent=JSON.stringify({issues},null,2);};
document.querySelector('#sauna').onclick=async()=>{if(busy)return;busy=true;const report={runs:[],errors};try{for(let pass=0;pass<2;pass++)for(const flag of (pass%2?[true,false]:[false,true])){room=8;day=1;mount(flag);await sleep(1600);room=16;api.setRoom(16);const transition=await sample(1600);levels(1);const lighting=await sample(3200);report.runs.push({pass,refined:flag,transition,lighting});out.textContent=JSON.stringify(report);status.textContent='Golf '+report.runs.length+'/4';}report.status='complete';}catch(e){report.error=String(e);}out.textContent=JSON.stringify(report,null,2);busy=false;room=16;mount(true);};
document.querySelector('#bench').onclick=async()=>{if(busy)return;busy=true;const report={runs:[],errors,viewport:[innerWidth,innerHeight],dpr:devicePixelRatio};try{
for(let pass=0;pass<2;pass++)for(const flag of (pass?[true,false]:[false,true])){
room=8;day=1;mount(flag);await sleep(1800);
for(const id of [4,5,8]){
status.textContent=`Mesure ${pass+1}/2 — ${flag?'après':'avant'} — pièce ${id}`;
api.setRoom(id===11?17:11);api.jump();room=id;api.setRoom(id);api.setVideoSource(id,2);const transition=await sample(1600);levels(0);await sleep(3200);levels(1);const lighting=await sample(3200);const steady=await sample(1200);
report.runs.push({pass,refined:flag,id,transition,lighting,steady,active:api.activeRoom(),phase:api.navigation().phase});out.textContent=JSON.stringify(report);
}}
report.attributesComplete=Object.values(api.rooms).every(r=>{let ok=true;r.group.traverse(o=>{if(o.isMesh&&o.material.vertexColors&&!o.geometry.attributes.color)ok=false;for(const a of Object.values(o.geometry?.attributes||{}))for(const n of a.array)if(!Number.isFinite(n))ok=false;});return ok;});report.status=errors.length||!report.attributesComplete?'failed':'complete';
}catch(e){report.status='failed';report.error=String(e);}out.textContent=JSON.stringify(report,null,2);status.textContent='Mesures terminées — '+report.status;busy=false;room=8;mount(true);};mount(true);

const verify=document.createElement('button');verify.id='matrix-check';verify.textContent='Vérifier les matrices visibles';document.querySelector('nav').append(verify);
verify.onclick=async()=>{if(busy)return;busy=true;const checks=[];room=4;mount(true);await sleep(1200);const sr=api.rooms[4].group.parent;let all=0;sr.traverse(()=>all++);
for(const id of [1,4,5,8,10]){room=id;api.setRoom(id);api.jump();api.setVideoSource(id,2);api.shadePos('rideau',1);await sleep(2300);const snapshots=[];sr.traverseVisible(o=>snapshots.push([o,o.matrixWorld.elements.slice()]));sr.updateMatrixWorld(true);const changed=snapshots.filter(([o,a])=>a.some((n,i)=>Math.abs(n-o.matrixWorld.elements[i])>1e-9));let visited=0;for(const b of sr.children)if(b.visible)b.traverse(()=>visited++);const timing=fn=>{const t=performance.now();for(let j=0;j<80;j++)fn();return (performance.now()-t)/80;};const fullMs=timing(()=>sr.updateMatrixWorld(true)),visibleMs=timing(()=>{for(const b of sr.children)if(b.visible)b.updateMatrixWorld(true);});checks.push({id,changed:changed.length,fullTraversal:all,visibleTraversal:visited,fullMs,visibleMs});}
out.textContent=JSON.stringify({status:checks.every(c=>c.changed===0)?'complete':'failed',checks},null,2);busy=false;};

const profile=document.createElement('button');profile.id='profile';profile.textContent='Profiler les premières transitions';document.querySelector('nav').append(profile);
const warmCheck=document.createElement('input');warmCheck.type='checkbox';warmCheck.id='warm-check';document.querySelector('nav').append(warmCheck);
const poolCheck=document.createElement('input');poolCheck.type='checkbox';poolCheck.id='pool-check';poolCheck.checked=true;document.querySelector('nav').append(poolCheck);
profile.onclick=async()=>{if(busy)return;busy=true;room=8;mount(poolCheck.checked);await sleep(2500);let warmMs=0;if(warmCheck.checked){const w=performance.now();await api.renderer.compileAsync(api.rooms[4].group.parent,new T.PerspectiveCamera());warmMs=performance.now()-w;await sleep(300);}let phase='warm',events=[],runs=[],restore=[];
for(const key of ['computeBoundingSphere','computeBoundingBox']){const original=T.BufferGeometry.prototype[key];T.BufferGeometry.prototype[key]=function(...a){const t=performance.now();try{return original.apply(this,a)}finally{const ms=performance.now()-t;if(ms>.5)events.push({type:key,ms,phase,at:t,vertices:this.attributes.position?.count});}};restore.push(()=>T.BufferGeometry.prototype[key]=original);}const gl=api.renderer.getContext();for(const key of ['compileShader','linkProgram','getProgramParameter','getShaderParameter','texImage2D','texSubImage2D','bufferData','bufferSubData','drawElements','drawArrays','drawElementsInstanced','getUniformLocation','useProgram']){const original=gl[key];gl[key]=function(...a){const t=performance.now();try{return original.apply(this,a)}finally{const ms=performance.now()-t;if(ms>1)events.push({type:key,ms,phase,at:t});}};restore.push(()=>gl[key]=original);}
const render=api.renderer.render;api.renderer.render=function(s,c){const t=performance.now(),dirty=this.shadowMap.needsUpdate,oldPrograms=this.info.programs.length;try{return render.call(this,s,c)}finally{const ms=performance.now()-t;if(ms>4)events.push({type:'render',ms,phase,at:t,shadowDirty:dirty,scene:s===api.rooms[4].group.parent?'interior':'other',programs:this.info.programs.length,newPrograms:this.info.programs.slice(oldPrograms).map(p=>({name:p.name,key:p.cacheKey.slice(0,500)}))});}};restore.push(()=>api.renderer.render=render);
let po;try{po=new PerformanceObserver(list=>{for(const e of list.getEntries())events.push({type:'longtask',at:e.startTime,ms:e.duration,phase});});po.observe({type:'longtask',buffered:false});}catch{}
try{for(const id of [4,5,4]){phase='transition-'+id;api.setRoom(id);api.setVideoSource(id,2);const transition=await sample(1800);phase='steady-'+id;const steady=await sample(1300);runs.push({id,transition,steady});out.textContent=JSON.stringify({runs,events});}}finally{restore.forEach(f=>f());po?.disconnect();busy=false;}out.textContent=JSON.stringify({status:'complete',pooled:poolCheck.checked,warmMs,runs,events},null,2);};

const freeze=document.createElement('button');freeze.id='freeze';freeze.textContent='Image fixe suite';document.querySelector('nav').append(freeze);freeze.onclick=async()=>{room=4;mount(poolCheck.checked);api.jump();api.remote('pause');api.rooms[4].tv.screen.st.tick=90;await sleep(3300);out.textContent=JSON.stringify({status:'image-ready',pooled:poolCheck.checked});};
const lightcheck=document.createElement('button');lightcheck.id='light-check';lightcheck.textContent='Vérifier lumière TV';document.querySelector('nav').append(lightcheck);
lightcheck.onclick=async()=>{if(busy)return;busy=true;room=8;mount(true);await sleep(1800);const sr=api.rooms[4].group.parent,checks=[];for(const id of [4,5,8,10]){room=id;api.setRoom(id);api.setVideoSource(id,2);let maxDistance=0,counts=new Set;for(let i=0;i<100;i++){await new Promise(r=>requestAnimationFrame(r));let lights=[];sr.traverseVisible(o=>{if(o.isPointLight)lights.push(o)});counts.add(lights.length);const pool=lights.find(l=>l.color.getHex()===0x9db8ff);const anchor=api.rooms[id].tv.light.getWorldPosition(new T.Vector3());if(pool)maxDistance=Math.max(maxDistance,new T.Vector3().setFromMatrixPosition(pool.matrixWorld).distanceTo(anchor));}api.setVideoSource(id,0);await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));const pool=sr.children.find(l=>l.isPointLight&&l.color.getHex()===0x9db8ff);checks.push({id,pointLights:[...counts],maxDistance,offIntensity:pool?.intensity});}out.textContent=JSON.stringify({status:'complete',checks});busy=false;};

const residual=document.createElement('button');residual.id='residual-bench';residual.textContent='Comparer préparation progressive';document.querySelector('nav').append(residual);residual.onclick=async()=>{if(busy)return;busy=true;const runs=[];for(const warm of [false,true,false,true]){room=6;day=1;mount(true);await sleep(2500);const render=api.renderer.render,events=[];let cam;api.renderer.render=function(s,c){cam=c;const t=performance.now(),old=this.info.programs.length;try{return render.call(this,s,c)}finally{const ms=performance.now()-t;if(ms>3)events.push({ms,programs:this.info.programs.length,added:this.info.programs.length-old});}};await sleep(100);const prepare=[],t=performance.now();if(warm){const objects=[];api.rooms[5].group.traverse(o=>{if(o.isMesh||o.isSprite)objects.push(o)});for(const o of objects){await new Promise(r=>requestIdleCallback(r));const start=performance.now(),promise=api.renderer.compileAsync(o,cam,api.rooms[5].group.parent),cpu=performance.now()-start;await promise;prepare.push(cpu);}}const preparationMs=performance.now()-t,preparationEvents=events.splice(0);room=5;api.setRoom(5);const transition=await sample(1800);const steady=await sample(1000);api.renderer.render=render;runs.push({warm,preparationMs,prepare,preparationEvents,transition,steady,events});out.textContent=JSON.stringify({status:'running',runs});}out.textContent=JSON.stringify({status:'complete',runs});status.textContent='Comparaison terminée';busy=false;};
</script>
