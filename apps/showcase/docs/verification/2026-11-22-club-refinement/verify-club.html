<!doctype html><meta charset="utf-8"><style>body{margin:0;background:#101322;color:white}iframe{width:1280px;height:720px;border:0}pre{font:12px monospace;white-space:pre-wrap}</style><iframe></iframe><pre>Mesure en cours</pre><script>
const f=document.querySelector('iframe'),out=document.querySelector('pre'),results=[];let variant=location.search.includes('before')?'before':'after';f.src='/ftv-luxury/venues/'+(variant==='before'?'before.html':'index.html')+'?project=club-etoile';
addEventListener('message',async e=>{if(e.data.type!=='ready'||e.source!==f.contentWindow)return;const v=f.contentWindow.__venue;for(const room of ['building','original','neon','sky']){v.apply({clubView:room==='building'?'building':'room',clubRoom:room==='building'?'original':room,lyresActive:true,smokeActive:true,roomSettings:{original:{scene:'party',level:75},neon:{scene:'party',level:75},sky:{scene:'party',level:75}}});await new Promise(r=>setTimeout(r,1400));const stamps=[],render=v.renderer.render.bind(v.renderer);v.renderer.render=(...a)=>{const start=performance.now();render(...a);stamps.push({t:start,ms:performance.now()-start})};await new Promise(r=>setTimeout(r,3000));v.renderer.render=render;const intervals=stamps.slice(1).map((s,i)=>s.t-stamps[i].t).sort((a,b)=>a-b);results.push({variant,room,frames:stamps.length,medianInterval:intervals[Math.floor(intervals.length*.5)],p95Interval:intervals[Math.floor(intervals.length*.95)],cpuRenderMs:stamps.reduce((s,x)=>s+x.ms,0)/stamps.length,...v.renderer.info.render,geometries:v.renderer.info.memory.geometries,textures:v.renderer.info.memory.textures});out.textContent=JSON.stringify(results)}document.body.dataset.done='true'});</script>
