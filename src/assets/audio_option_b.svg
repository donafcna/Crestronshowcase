<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <defs>
    <linearGradient id="barGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
  <!-- 5 Ultra-thin 3px wide pill bars with smooth cubic ease -->
  <rect x="8" y="16" width="3.5" height="16" rx="1.75" fill="url(#barGrad)">
    <animate attributeName="height" values="10;28;14;30;10" dur="1.1s" repeatCount="indefinite"/>
    <animate attributeName="y" values="19;10;17;9;19" dur="1.1s" repeatCount="indefinite"/>
  </rect>
  <rect x="16" y="8" width="3.5" height="32" rx="1.75" fill="url(#barGrad)">
    <animate attributeName="height" values="32;12;28;10;32" dur="0.9s" repeatCount="indefinite"/>
    <animate attributeName="y" values="8;18;10;19;8" dur="0.9s" repeatCount="indefinite"/>
  </rect>
  <rect x="24" y="12" width="3.5" height="24" rx="1.75" fill="url(#barGrad)">
    <animate attributeName="height" values="14;34;8;26;14" dur="1.3s" repeatCount="indefinite"/>
    <animate attributeName="y" values="17;7;20;11;17" dur="1.3s" repeatCount="indefinite"/>
  </rect>
  <rect x="32" y="10" width="3.5" height="28" rx="1.75" fill="url(#barGrad)">
    <animate attributeName="height" values="28;14;32;12;28" dur="1.0s" repeatCount="indefinite"/>
    <animate attributeName="y" values="10;17;8;18;10" dur="1.0s" repeatCount="indefinite"/>
  </rect>
  <rect x="40" y="18" width="3.5" height="12" rx="1.75" fill="url(#barGrad)">
    <animate attributeName="height" values="12;22;8;24;12" dur="1.2s" repeatCount="indefinite"/>
    <animate attributeName="y" values="18;13;20;12;18" dur="1.2s" repeatCount="indefinite"/>
  </rect>
</svg>