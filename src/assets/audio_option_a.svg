<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <defs>
    <linearGradient id="waveGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <!-- Speaker dot -->
  <circle cx="14" cy="24" r="4" fill="url(#waveGrad)"/>
  <!-- Wave 1 -->
  <path d="M 22 14 A 14 14 0 0 1 22 34" fill="none" stroke="url(#waveGrad)" stroke-width="2.5" stroke-linecap="round">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="1.2s" repeatCount="indefinite"/>
  </path>
  <!-- Wave 2 -->
  <path d="M 28 9 A 21 21 0 0 1 28 39" fill="none" stroke="url(#waveGrad)" stroke-width="2.5" stroke-linecap="round">
    <animate attributeName="opacity" values="1;0.3;1" dur="1.2s" repeatCount="indefinite"/>
  </path>
  <!-- Wave 3 -->
  <path d="M 34 4 A 28 28 0 0 1 34 44" fill="none" stroke="url(#waveGrad)" stroke-width="2.5" stroke-linecap="round">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="1.2s" repeatCount="indefinite"/>
  </path>
</svg>