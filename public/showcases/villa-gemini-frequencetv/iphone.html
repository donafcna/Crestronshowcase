<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Désactivation du cache (démo toujours à jour) -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Fréquence TV - Villa (iPhone)</title>
    <!-- Configuration locale de la villa (pièces, sources, moteurs, circuits) -->
    <script src="config.js"></script>
    <!-- Composants CH5 (rendu des boutons / sliders) puis moteur d'état local 100 % front-end -->
    <script src="js/ch5-components.js"></script>
    <script src="js/local-feedback.js"></script>
    <link rel="stylesheet" href="themes/dark-theme.css">
    <style>
        :root {
            /* Variables par défaut - Thème Sombre */
            --bg-color: #0f1013;
            --bg-gradient: linear-gradient(rgba(15, 16, 19, 0.8), rgba(15, 16, 19, 0.85));
            --container-bg: rgba(22, 25, 32, 0.8);
            --border-color: rgba(255, 255, 255, 0.06);
            --text-primary: #ffffff;
            --text-secondary: #94a3b8;
            --card-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            --blur-val: blur(15px);
        }

        body.theme-light {
            --bg-color: #f1f5f9;
            --bg-gradient: linear-gradient(rgba(241, 245, 249, 0.85), rgba(226, 232, 240, 0.9));
            --container-bg: rgba(255, 255, 255, 0.9);
            --border-color: rgba(0, 0, 0, 0.08);
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --card-shadow: 0 8px 32px rgba(15, 23, 42, 0.08);
        }

        body.theme-glass {
            --bg-color: transparent;
            --bg-gradient: linear-gradient(rgba(255, 255, 255, 0.03), rgba(255, 255, 255, 0.05));
            --container-bg: rgba(255, 255, 255, 0.1);
            --border-color: rgba(255, 255, 255, 0.15);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.7);
            --card-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
            --blur-val: blur(25px);
        }

        body.theme-cyber {
            --bg-color: #070913;
            --bg-gradient: linear-gradient(rgba(7, 9, 19, 0.8), rgba(15, 12, 30, 0.85));
            --container-bg: rgba(13, 17, 33, 0.7);
            --border-color: rgba(6, 182, 212, 0.25);
            --text-primary: #e0e7ff;
            --text-secondary: #818cf8;
            --card-shadow: 0 8px 32px rgba(6, 182, 212, 0.15);
            --blur-val: blur(15px);
        }

        /* Classes de styles unifiées pour les paramètres HVAC */
        .measured-temp-val {
            color: #00b4c5 !important; /* Cyan */
        }
        .consigne-temp-val {
            color: #d97706 !important; /* Amber / Orange */
        }
        .hvac-mode-val {
            color: #3b82f6 !important; /* Blue */
        }

        body {
            background: var(--bg-gradient), url('themes/villa_bg.jpg') no-repeat center center / cover;
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            margin: 0;
            padding: 10px;
            height: 100vh;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: background 0.3s ease, color 0.3s ease;
        }

        /* Keyframes Widgets Ticker */
        @keyframes marquee {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.95; }
        }

        /* --- ENTÊTE (PIECE SELECTOR + ALARME DYNAMIQUES) --- */
        .header-section {
            background-color: var(--container-bg);
            backdrop-filter: var(--blur-val);
            -webkit-backdrop-filter: var(--blur-val);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 10px 12px;
            margin-bottom: 8px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            transition: all 0.3s ease;
        }
        .room-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }
        .room-row label {
            font-weight: bold;
            font-size: 0.95rem;
            color: var(--text-secondary);
        }
        .room-dropdown {
            flex: 1;
            background: var(--bg-color);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            outline: none;
            box-sizing: border-box;
            height: 38px;
        }
        .alarm-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-top: 1px solid var(--border-color);
            padding-top: 8px;
        }
        .alarm-row span {
            font-weight: bold;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        /* Boutons Alarme sur iPhone */
        .alarm-btn-mobile {
            width: 105px;
            height: 40px;
            font-size: 0.8rem;
            font-weight: bold;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-sizing: border-box;
            transition: all 0.2s ease;
        }
        .alarm-btn-mobile.armer {
            background-color: rgba(44, 26, 26, 0.9);
            border: 1px solid rgba(220, 38, 38, 0.4);
            color: #fca5a5;
        }
        .alarm-btn-mobile.armer.selected {
            background-color: #dc2626;
            border: 1px solid #ffffff;
            color: #ffffff;
        }
        .alarm-btn-mobile.desarmer {
            background-color: rgba(22, 44, 30, 0.9);
            border: 1px solid rgba(16, 185, 129, 0.4);
            color: #a7f3d0;
        }
        .alarm-btn-mobile.desarmer.selected {
            background-color: #10b981;
            border: 1px solid #ffffff;
            color: #ffffff;
        }

        /* --- ZONE DE CONTENU PRINCIPAL --- */
        .content-area {
            flex: 1;
            min-height: 0;
            position: relative;
        }
        .tab-panel {
            display: none;
            flex-direction: column;
            height: 100%;
            background-color: var(--container-bg);
            backdrop-filter: var(--blur-val);
            -webkit-backdrop-filter: var(--blur-val);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 15px;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }
        .tab-panel.active {
            display: flex;
        }

        /* Titre des onglets */
        h2 {
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-primary);
            margin: 0 0 12px 0;
            padding-bottom: 6px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* --- STYLES ONGLET 1 : LUMIÈRES & STORES (Boutons Natifs Parfaitement Centrés) --- */
        .scene-btn-mobile, .source-btn-mobile {
            width: 48%;
            height: 48px;
            font-size: 0.9rem;
            font-weight: bold;
            border-radius: 8px;
            background-color: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #cbd5e1;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-sizing: border-box;
            transition: all 0.2s ease;
        }
        .scene-btn-mobile:active, .source-btn-mobile:active {
            background-color: rgba(196, 154, 69, 0.4) !important;
            border-color: #ffffff !important;
            transform: scale(0.95) !important;
            transition: all 0.05s ease !important;
        }
        .scene-btn-mobile.selected {
            background-color: rgba(196, 154, 69, 0.15) !important;
            border: 2px solid #c49a45 !important;
            color: #ffffff !important;
            box-shadow: 0 0 12px rgba(196, 154, 69, 0.4) !important;
        }
        
        .popup-trigger-btn {
            width: 100%;
            height: 48px;
            margin-top: 8px;
            background-color: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #cbd5e1;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
        }
        .popup-trigger-btn:active {
            background-color: rgba(255, 255, 255, 0.1);
        }

        /* Stores & Rideaux boutons natifs avec centrage */
        .shade-control-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.02);
            padding: 8px 10px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            margin-bottom: 5px;
        }
        .shade-label {
            font-weight: 600;
            font-size: 0.85rem;
            color: #cbd5e1;
        }
        .shade-btn-mobile {
            width: 44px;
            height: 38px;
            font-size: 0.95rem;
            border-radius: 6px;
            background-color: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #cbd5e1;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-sizing: border-box;
            transition: all 0.2s ease;
            line-height: 1;
        }
        .shade-btn-mobile:active {
            background-color: rgba(196, 154, 69, 0.4) !important;
            border-color: #ffffff !important;
            transform: scale(0.9) !important;
            transition: all 0.05s ease !important;
        }

        /* --- STYLES ONGLET 2 : TEMPERATURE --- */
        .temp-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
        }
        ch5-button[customClass~="temp-btn-mobile"] {
            width: 60px !important;
            height: 60px !important;
            min-width: 60px !important;
            min-height: 60px !important;
            max-width: 60px !important;
            max-height: 60px !important;
            flex: 0 0 60px !important;
            display: inline-block !important;
        }
        ch5-button[customClass~="temp-btn-mobile"] button,
        ch5-button[customClass~="temp-btn-mobile"] .cb-btn {
            width: 100% !important;
            height: 100% !important;
            background-color: rgba(36, 34, 32, 0.9) !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            color: #ffffff !important;
            border-radius: 12px !important;
            font-size: 2.2rem !important;
            font-weight: bold !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            line-height: 1 !important;
            cursor: pointer !important;
            padding: 0 !important;
            margin: 0 !important;
            box-sizing: border-box !important;
        }
        ch5-button[customClass~="temp-btn-mobile"] .cb-btn-label,
        ch5-button[customClass~="temp-btn-mobile"] span {
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            width: 100% !important;
            height: 100% !important;
            margin: 0 !important;
            padding: 0 !important;
            line-height: 1 !important;
            text-align: center !important;
        }
        ch5-button[customClass~="temp-btn-mobile"] button:active,
        ch5-button[customClass~="temp-btn-mobile"] .cb-btn:active {
            background-color: rgba(255, 255, 255, 0.1) !important;
        }
        .temp-display {
            font-size: 3rem;
            font-weight: bold;
            color: #00b4c5;
            margin: 15px 0;
        }

        /* --- STYLES ONGLET 3 : SELECTION SOURCES AUDIO ET VIDEO --- */
        .source-btn-mobile.selected {
            background-color: rgba(139, 92, 246, 0.15) !important;
            border: 2px solid #8b5cf6 !important;
            color: #ffffff !important;
            box-shadow: 0 0 15px rgba(139, 92, 246, 0.4) !important;
        }
        
        /* Bouton Mute Haut-Parleur Tactile */
        .mute-btn-mobile {
            width: 65px;
            height: 65px;
            border-radius: 10px;
            background-color: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            background-repeat: no-repeat;
            background-position: center center;
            background-size: 26px 26px;
            box-sizing: border-box;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            outline: none;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512" fill="%23cbd5e1"><path d="M224 88V424c0 21.3-25.9 32-41 17L94.1 352H24c-13.3 0-24-10.7-24-24V184c0-13.3 10.7-24 24-24h70.1l88.9-89c15.1-15 41-4.3 41 17zM320 256c0-36.4-24.4-67.3-57.9-76.8c-11.7-3.3-23.7 3.5-27 15.2s3.5 23.7 15.2 27c17.1 4.8 29.8 20.3 29.8 34.6s-12.7 29.7-29.8 34.6c-11.7 3.3-18.5 15.3-15.2 27s15.3 18.5 27 15.2c33.5-9.5 57.9-40.4 57.9-76.8zm71-141.7c-11.7-3.3-23.7 3.5-27 15.2s3.5 23.7 15.2 27c38.4 10.9 68.9 45.4 68.9 93.5s-30.5 82.6-68.9 93.5c-11.7 3.3-18.5 15.3-15.2 27s15.3 18.5 27 15.2c51.9-14.7 93.1-59.5 93.1-135.7s-41.2-121-93.1-135.7z"/></svg>');
        }
        .mute-btn-mobile:hover {
            background-color: rgba(255, 255, 255, 0.08);
        }
        .mute-btn-mobile.selected {
            background-color: rgba(220, 38, 38, 0.1) !important;
            border: 2px solid #dc2626 !important;
            box-shadow: 0 0 15px rgba(220, 38, 38, 0.4) !important;
            background-size: 100% 100% !important; /* Diagonale complète */
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 70 70"><g transform="translate(22, 19) scale(0.057)" opacity="0.45"><path fill="%23cbd5e1" d="M224 88V424c0 21.3-25.9 32-41 17L94.1 352H24c-13.3 0-24-10.7-24-24V184c0-13.3 10.7-24 24-24h70.1l88.9-89c15.1-15 41-4.3 41 17z"/></g><line x1="4" y1="4" x2="66" y2="66" stroke="%23dc2626" stroke-width="5" stroke-linecap="round"/><line x1="66" y1="4" x2="4" y2="66" stroke="%23dc2626" stroke-width="5" stroke-linecap="round"/></svg>') !important;
        }

        .volume-slider-mobile {
            width: 100% !important;
            height: 35px !important;
        }
        /* Forcer tous les enfants internes (même le shadow DOM de NouiSlider) à être bridés à 190px de large pour optimiser l'espace */
        .volume-slider-mobile,
        .volume-slider-mobile * {
            max-width: 190px !important;
        }

        /* Curseurs de circuits d'éclairage : élargissement à 100% dans les fenêtres popup */
        .circuit-slider-mobile {
            width: 100% !important;
            height: 35px !important;
        }
        .circuit-slider-mobile,
        .circuit-slider-mobile * {
            max-width: 100% !important;
        }
        /* Sliders d'éclairage en jaune dans l'overlay circuits (Mobile) */
        #circuits-overlay ch5-slider .noUi-connect {
            background: #eab308 !important;
        }
        #circuits-overlay ch5-slider .noUi-handle {
            background: #eab308 !important;
            border: 2px solid #fef08a !important;
            box-shadow: 0 0 12px rgba(234, 179, 8, 0.5) !important;
        }
        .volume-slider-mobile .noUi-connect {
            background: #0ea5e9 !important;
        }
        .volume-slider-mobile.muted-slider {
            opacity: 0.3 !important;
            pointer-events: none !important;
        }

        .power-off-btn-mobile {
            width: 65px;
            height: 65px;
            background-color: rgba(220, 38, 38, 0.15);
            border: 1px solid rgba(220, 38, 38, 0.4);
            border-radius: 50%;
            transition: all 0.2s ease;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="%23fca5a5"><path d="M288 32c0-17.7-14.3-32-32-32s-32 14.3-32 32V256c0 17.7 14.3 32 32 32s32-14.3 32-32V32zM143.5 120.6c13.6-11.3 15.4-31.5 4.1-45.1s-31.5-15.4-45.1-4.1C43.9 120.3 0 183 0 256c0 141.4 114.6 256 256 256s256-114.6 256-256c0-73-43.9-135.7-102.5-179.6c-13.6-10.3-33.8-8.5-45.1 4.1s-8.5 33.8 4.1 45.1C412.1 165.6 448 206.6 448 256c0 106-86 192-192 192S64 362 64 256c0-49.4 35.9-90.4 84.5-125.6h-5z"/></svg>');
            background-repeat: no-repeat;
            background-position: center;
            background-size: 26px 26px;
            cursor: pointer;
            box-sizing: border-box;
        }
        .power-off-btn-mobile.selected {
            background-color: #dc2626;
            border: 2px solid #ffffff;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="%23ffffff"><path d="M288 32c0-17.7-14.3-32-32-32s-32 14.3-32 32V256c0 17.7 14.3 32 32 32s32-14.3 32-32V32zM143.5 120.6c13.6-11.3 15.4-31.5 4.1-45.1s-31.5-15.4-45.1-4.1C43.9 120.3 0 183 0 256c0 141.4 114.6 256 256 256s256-114.6 256-256c0-73-43.9-135.7-102.5-179.6c-13.6-10.3-33.8-8.5-45.1 4.1s-8.5 33.8 4.1 45.1C412.1 165.6 448 206.6 448 256c0 106-86 192-192 192S64 362 64 256c0-49.4 35.9-90.4 84.5-125.6h-5z"/></svg>');
        }

        /* --- BARRE DE NAVIGATION BASSE (TABS) --- */
        .bottom-nav {
            background-color: rgba(22, 25, 32, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 6px;
            display: flex;
            gap: 6px;
            margin-top: 8px;
        }
        .nav-btn {
            flex: 1;
            background: transparent;
            border: 1px solid transparent; /* Évite le décalage de taille (effet de saut) au clic */
            color: #94a3b8;
            padding: 10px 4px;
            font-size: 0.78rem; /* Légèrement réduit pour que "Lumières et stores" tienne parfaitement sur une ligne */
            font-weight: bold;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .nav-btn.active {
            background-color: rgba(14, 165, 233, 0.15);
            color: #0ea5e9;
            border: 1px solid rgba(14, 165, 233, 0.2);
        }

        /* --- POPUPS / OVERLAYS --- */
        .custom-overlay-panel {
            display: none;
            position: fixed !important;
            top: 50% !important;
            left: 50% !important;
            transform: translate(-50%, -50%) !important;
            z-index: 999999 !important;
            width: 95% !important;
            height: 90% !important;
            background-color: rgba(22, 25, 32, 0.98) !important;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            padding: 15px;
            box-sizing: border-box;
        }
        /* Fond grisé d'arrière-plan pour modales (Backdrop) */
        .modal-backdrop {
            display: none;
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            background-color: rgba(0, 0, 0, 0.6) !important;
            backdrop-filter: blur(8px) !important;
            -webkit-backdrop-filter: blur(8px) !important;
            z-index: 999998 !important;
        }
        .overlay-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 10px;
            margin-bottom: 12px;
        }
        .overlay-header h3 {
            margin: 0;
            font-size: 1.05rem;
            color: #00b4c5;
        }
        .overlay-content {
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
            max-height: calc(100% - 60px);
            padding-right: 2px;
        }
        .overlay-item {
            background: rgba(255, 255, 255, 0.02);
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }
        .overlay-item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
    </style>
</head>
<body>
    <!-- Fond grisé pour modales (Backdrop) -->
    <div id="modal-backdrop" class="modal-backdrop" onclick="closeAllModals()"></div>

    <!-- ENTÊTE (PIECE & ALARME DYNAMIQUES) -->
    <div class="header-section">
        <div class="room-row">
            <div style="white-space: nowrap; display: flex; align-items: center; gap: 5px;">
                <span data-i18n="active_piece">Pièce Active</span>
                <span id="version-label" style="font-size: 0.75rem; color: rgba(255,255,255,0.3); font-weight: normal;">v1.0.149</span>
                <span style="color: var(--text-secondary); font-weight: bold; font-size: 0.95rem;">:</span>
            </div>
            <select id="room-select" class="room-dropdown" onchange="changeRoomIphone(this.value)">
                <!-- Rempli dynamiquement -->
            </select>
            <button onclick="openSettingsModal()" style="background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: var(--text-primary); padding: 8px; border-radius: 8px; cursor: pointer; font-size: 1.1rem; display: flex; align-items: center; justify-content: center; width: 38px; height: 38px; box-sizing: border-box;">
                ⚙️
            </button>
        </div>

            // --- MODULE DE TRADUCTION ---
            function applyLanguage(lang) {
                currentLang = lang;
                try {
                    localStorage.setItem('crestron_lang_iphone', lang);
                } catch (e) {}
                const dict = translations[lang] || translations['fr'];

                document.querySelectorAll('[data-i18n]').forEach(el => {
                    const key = el.getAttribute('data-i18n');
                    if (dict[key]) {
                        if (el.tagName.toLowerCase() === 'ch5-button') {
                            el.setAttribute('label', dict[key]);
                        } else {
                            const svg = el.querySelector('svg');
                            const span = el.querySelector('span');
                            if (svg || span) {
                                let newContent = '';
                                if (svg) newContent += svg.outerHTML + ' ';
                                newContent += dict[key];
                                if (span) newContent += ' ' + span.outerHTML;
                                el.innerHTML = newContent;
                            } else {
                                el.textContent = dict[key];
                            }
                        }
                    }
                });

                const selectEl = document.getElementById('lang-select');
                if (selectEl) selectEl.value = lang;
            }

            window.changeLanguage = function(lang) {

                updateActiveRoomUI(curRoom);

            window.saveGlobalPresetConfig = function() {
                const selectEl = document.getElementById('customizer-preset-select');
                if (!selectEl) return;
                const subPreset = selectEl.value;
                let finalConfig = {};
                
                if (activePresetType === 'lighting') {
                    for (let rId = 1; rId <= 8; rId++) {
                        const circuits = config.roomCircuits && config.roomCircuits[rId] ? config.roomCircuits[rId] : [];
                        if (circuits.length === 0) {
                            for (let cId = 71; cId <= 74; cId++) {
                                const chk = document.getElementById(`cfg-light-chk-${rId}-${cId}`);
                                const valInput = chk ? chk.nextElementSibling.nextElementSibling : null;
                                if (chk && chk.checked && valInput) {
                                    if (!finalConfig[rId]) finalConfig[rId] = {};
                                    const rawVal = parseFloat(valInput.value) || 0;
                                    finalConfig[rId][cId] = Math.round((rawVal / 100) * 65535);
                                }
                            }
                        } else {
                            circuits.forEach(c => {
                                const chk = document.getElementById(`cfg-light-chk-${rId}-${c.id}`);
                                const valInput = chk ? chk.nextElementSibling.nextElementSibling : null;
                                if (chk && chk.checked && valInput) {
                                    if (!finalConfig[rId]) finalConfig[rId] = {};
                                    const rawVal = parseFloat(valInput.value) || 0;
                                    finalConfig[rId][c.id] = Math.round((rawVal / 100) * 65535);
                                }
                            });
                        }
                    }
                } else if (activePresetType === 'shades') {
                    for (let rId = 1; rId <= 8; rId++) {
                        for (let mId = 1; mId <= 6; mId++) {
                            const chk = document.getElementById(`cfg-shade-chk-${rId}-${mId}`);
                            if (chk && chk.checked) {
                                if (!finalConfig[rId]) finalConfig[rId] = [];
                                finalConfig[rId].push(mId);
                            }
                        }
                    }
                } else if (activePresetType === 'hvac') {
                    for (let rId = 1; rId <= 8; rId++) {
                        const chk = document.getElementById(`cfg-hvac-chk-${rId}`);
                        const valInput = chk ? chk.nextElementSibling.nextElementSibling : null;
                        if (chk && chk.checked && valInput) {
                            const rawVal = parseFloat(valInput.value) || 21.0;
                            finalConfig[rId] = { temp: Math.round(rawVal * 10) };
                        }
                    }
                } else if (activePresetType === 'vacation') {
                    ["light", "shade", "hvac"].forEach(key => {
                        const chk = document.getElementById(`cfg-vacation-chk-${key}`);
                        if (chk) {
                            finalConfig[key] = chk.checked;
                        }
                    });
                }
                
                // Sauvegarder dans localStorage
                localStorage.setItem('preset_cfg_' + subPreset, JSON.stringify(finalConfig));
                
                // Signal texte 420 : configuration du preset (moteur d'état local)
                const payload = {
                    preset: subPreset,
                    data: finalConfig
                };
                if (typeof CrComLib !== 'undefined') {
                    console.log("Villa: configuration du preset enregistrée", payload);
                    CrComLib.publishEvent('s', '420', JSON.stringify(payload));
                }
                
                window.showToast("Configuration du Preset enregistrée !");
                window.closeGlobalPresetCustomizer();
            };

                    circuits.forEach(circ => {
                        const item = document.createElement('div');
                        item.className = "overlay-item";
                        
                        const label = document.createElement('p');
                        label.style = "margin: 0 0 5px 0; font-weight: bold; color: var(--text-secondary); font-size: 0.85rem;";
                        label.innerText = circ.name;
                        
                        const slider = document.createElement('ch5-slider');
                        slider.className = "circuit-slider-mobile";
                        slider.setAttribute('min', '0');
                        slider.setAttribute('max', '65535');
                        slider.setAttribute('sendEventOnChange', circ.id.toString());
                        slider.setAttribute('receiveStateValue', circ.id.toString());
                        slider.setAttribute('style', "height: 25px; margin: 0;");
                        
                        item.appendChild(label);
                        item.appendChild(slider);
                        circuitsContainer.appendChild(item);
                    });
                }
            }

            // --- BUILD DYNAMIC DOM ---
            function generateDynamicUI(cfg) {
                config = cfg;

                // A. Remplir le dropdown de pièces
                const roomSelect = document.getElementById('room-select');
                if (roomSelect) {
                    roomSelect.innerHTML = '';
                    config.rooms.forEach(room => {
                        const opt = document.createElement('option');
                        opt.value = room.id.toString();
                        opt.innerText = room.name;
                        roomSelect.appendChild(opt);
                    });
                }

                // B. Remplir les sources multimédia
                const sourcesContainer = document.getElementById('sources-container');
                if (sourcesContainer) {
                    sourcesContainer.innerHTML = '';
                    const srcKeyMap = {
                        1: 'appletv',
                        2: 'skyq',
                        3: 'swisscom',
                        4: 'iptv'
                    };
                    config.sources.forEach(src => {
                        const wrapper = document.createElement('div');
                        wrapper.style = "display: flex; flex-direction: column; gap: 4px; width: 48%; box-sizing: border-box; margin-bottom: 8px;";
                        
                        const btn = document.createElement('button');
                        btn.id = `source-btn-${src.id}`;
                        btn.className = "source-btn-mobile";
                        btn.innerText = src.name;
                        btn.style = "width: 100%; margin: 0;";
                        btn.onclick = () => selectSource(src.id);
                        
                        const cogKey = srcKeyMap[src.id] || 'appletv';
                        const cog = document.createElement('button');
                        cog.className = "shades-config-cog";
                        cog.style = "cursor: pointer; display: flex; align-items: center; justify-content: center; width: 100%; height: 26px; border-radius: 6px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); padding: 0; outline: none;";
                        cog.onclick = () => openSourceControlModal(cogKey);
                        cog.innerHTML = `<svg viewBox="0 0 512 512" style="width: 12px; height: 12px; fill: #cbd5e1;"><path d="M495.9 166.6c3.2 8.7 .5 18.4-6.4 24.6l-43.3 39.4c1.1 8.3 1.7 16.8 1.7 25.4s-.6 17.1-1.7 25.4l43.3 39.4c6.9 6.2 9.6 15.9 6.4 24.6l-43.3 75c-3.2 8.7-12.2 13.9-21.4 11.7l-56.4-13.6c-15.6 12-33 21.6-51.7 28.5l-11.9 57.3c-2 9.7-10.5 16.7-20.5 16.7H220.4c-10 0-18.5-7-20.5-16.7l-11.9-57.3c-18.7-6.9-36.1-16.4-51.7-28.5l-56.4 13.6c-9.2 2.2-18.2-3-21.4-11.7l-43.3-75c-3.2-8.7-.5-18.4 6.4-24.6l43.3-39.4c-1.1-8.3-1.7-16.8-1.7-25.4s.6-17.1 1.7-25.4L21.6 191.2c-6.9-6.2-9.6-15.9-6.4-24.6l43.3-75c3.2-8.7 12.2-13.9 21.4-11.7l56.4 13.6c15.6-12 33-21.6 51.7-28.5l11.9-57.3c2-9.7 10.5-16.7 20.5-16.7h72.8c10 0 18.5 7 20.5 16.7l11.9 57.3c18.7 6.9 36.1 16.4 51.7 28.5l56.4-13.6c9.2-2.2 18.2 3 21.4 11.7l43.3 75zM256 336a80 80 0 1 0 0-160 80 80 0 1 0 0 160z"/></svg>`;
                        
                        wrapper.appendChild(btn);
                        wrapper.appendChild(cog);
                        sourcesContainer.appendChild(wrapper);
                    });
                }

                // Les éclairages sont générés dynamiquement par updateActiveRoomUI lors de l'initialisation et du changement de pièce.

                let curRoom = 1;
                try {
                    curRoom = parseInt(localStorage.getItem('active_room_iphone') || '1', 10);
                } catch (e) {}
                if (roomSelect) roomSelect.value = curRoom.toString();
                updateActiveRoomUI(curRoom);

            }

            // --- CONFIGURATION LOCALE (config.js) ET MOTEUR D'ÉTAT ---
            const bootConfig = (typeof window.crestronConfig !== 'undefined') ? window.crestronConfig : fallbackConfig;
            generateDynamicUI(bootConfig);
            setTimeout(function startEngine() {
                if (typeof Villa === 'undefined') { setTimeout(startEngine, 50); return; }
                Villa.init(bootConfig);
            }, 0);

            // --- ABONNEMENTS AUX SIGNAUX DU MOTEUR D'ÉTAT LOCAL ---
            if (typeof CrComLib !== 'undefined') {
                





                // Pièce active - DÉSOLIDARISATION
                // CrComLib.subscribeState('n', '10', ... ) est retiré.
                
                window.changeRoomIphone = function(value) {
                    const roomVal = parseInt(value, 10);
                    if (typeof Villa !== 'undefined') Villa.selectRoom(roomVal);
                    updateActiveRoomUI(roomVal);
                };

                // Room active feedback (Digital Joins 11-18)
                for (let i = 11; i <= 18; i++) {
                    CrComLib.subscribeState('b', i.toString(), (value) => {
                        if (value) {
                            const roomId = i - 10;
                            const roomSelect = document.getElementById('room-select');
                            if (roomSelect) roomSelect.value = roomId.toString();
                            updateActiveRoomUI(roomId);
                        }
                    });
                }

                // Scènes active feedback
                [21, 22, 23, 24].forEach(join => {
                    CrComLib.subscribeState('b', join.toString(), (value) => {
                        toggleSelected('scene-btn-' + join, value);
                    });
                });

                // Alarme feedback
                CrComLib.subscribeState('b', '41', (value) => {
                    toggleSelected('alarm-btn-41', value);
                });
                CrComLib.subscribeState('b', '42', (value) => {
                    toggleSelected('alarm-btn-42', value);
                });

                // Subscriptions pour l'alarme (v1.0.15)
                const alarmPartitions = [
                    { id: 1, armed: '301', partial: '302', disarmed: '303' },
                    { id: 2, armed: '304', partial: '305', disarmed: '306' },
                    { id: 3, armed: '307', partial: '308', disarmed: '309' },
                    { id: 4, armed: '310', partial: '311', disarmed: '312' }
                ];
                alarmPartitions.forEach(part => {
                    CrComLib.subscribeState('b', part.armed, (value) => {
                        if (value) {
                            const el = document.getElementById(`alarm-part-${part.id}-status`);
                            if (el) {
                                el.innerText = "ARMÉE";
                                el.style.color = "#ef4444";
                                el.style.background = "rgba(239,68,68,0.1)";
                            }
                        }
                    });
                    CrComLib.subscribeState('b', part.partial, (value) => {
                        if (value) {
                            const el = document.getElementById(`alarm-part-${part.id}-status`);
                            if (el) {
                                el.innerText = "PARTIELLE";
                                el.style.color = "#f59e0b";
                                el.style.background = "rgba(245,158,11,0.1)";
                            }
                        }
                    });
                    CrComLib.subscribeState('b', part.disarmed, (value) => {
                        if (value) {
                            const el = document.getElementById(`alarm-part-${part.id}-status`);
                            if (el) {
                                el.innerText = "DESACTIVÉE";
                                el.style.color = "#10b981";
                                el.style.background = "rgba(16,185,129,0.1)";
                            }
                        }
                    });
                });

                // Sources active feedback (Digital Joins 150-154)
                for (let i = 150; i <= 155; i++) {
                    CrComLib.subscribeState('b', i.toString(), (value) => {
                        if (value) {
                            const sourceId = i - 150;
                            config.sources.forEach(src => {
                                toggleSelected('source-btn-' + src.id, sourceId === src.id);
                            });
                            toggleSelected('power-off-btn-mobile', sourceId === 0);
                        }
                    });
                }

                // Mute feedback
                CrComLib.subscribeState('b', '53', (value) => {
                    const slider = document.getElementById('volume-slider-mobile-element');
                    const muteBtn = document.getElementById('mute-btn-mobile');
                    if (value) {
                        if (slider) {
                            slider.classList.add('muted-slider');
                            slider.setAttribute('disabled', 'true');
                        }
                        if (muteBtn) muteBtn.classList.add('selected');
                    } else {
                        if (slider) {
                            slider.classList.remove('muted-slider');
                            slider.removeAttribute('disabled');
                        }
                        if (muteBtn) muteBtn.classList.remove('selected');
                    }
                });

                // HVAC Consigne feedback (String Join 34)
                let currentConsigne = 210;
                CrComLib.subscribeState('s', '34', (value) => {
                    const el = document.getElementById('consigne-val');
                    if (el) el.innerText = value;
                    
                    const parsed = parseFloat(value);
                    if (!isNaN(parsed) && parsed > 0) {
                        currentConsigne = Math.round(parsed * 10);
                    }
                });

                // Température Actuelle feedback (String Join 32)
                CrComLib.subscribeState('s', '32', (value) => {
                    const el = document.getElementById('temp-val');
                    if (el) el.innerText = value;
                });



                // HVAC Status Mode feedback
                CrComLib.subscribeState('s', '33', (value) => {
                    const statusEl = document.getElementById('hvac-status');
                    if (statusEl) statusEl.innerText = value.toUpperCase();
                });
            }

            // Appliquer langue et thème sauvés
            applyLanguage(currentLang);
            applyTheme(currentTheme);

            // G. Son caché sur le widget météo (triple clic/tap)
            let weatherClicks = 0;
            const weather = document.getElementById('weather-widget');
            if (weather) {
                const handleWeather = (e) => {
                    weatherClicks++;
                    if (weatherClicks >= 3) {
                        weatherClicks = 0;
                        window.playFunnySound();
                    }
                    setTimeout(() => { weatherClicks = 0; }, 1500);
                };
                weather.addEventListener('click', handleWeather);
                weather.addEventListener('touchstart', handleWeather);
            }
        });

        window.playFunnySound = function() {
            try {
                console.log("Playing funny sound...");
                const audioObj = new Audio('funny.mp3');
                audioObj.volume = 1.0;
                audioObj.play().then(() => {
                    console.log("Audio playing successfully via Audio constructor.");
                }).catch(err => {
                    console.log("Audio constructor failed, trying fallback DOM element.", err);
                    const audioDom = document.getElementById('funny-audio');
                    if (audioDom) {
                        audioDom.volume = 1.0;
                        audioDom.play().catch(domErr => {
                            console.log("DOM Audio element failed, playing synth fallback.", domErr);
                            playSynthSound();
                        });
                    } else {
                        playSynthSound();
                    }
                });
            } catch (e) {
                console.log("Audio play failed, falling back to synth.", e);
                playSynthSound();
            }
        };

        function playSynthSound() {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                const ctx = new AudioContext();
                let now = ctx.currentTime;
                
                // 1. Boing cartoon (0s - 0.7s)
                const osc1 = ctx.createOscillator();
                const gain1 = ctx.createGain();
                osc1.type = 'triangle';
                osc1.frequency.setValueAtTime(100, now);
                osc1.frequency.exponentialRampToValueAtTime(800, now + 0.3);
                osc1.frequency.exponentialRampToValueAtTime(150, now + 0.6);
                gain1.gain.setValueAtTime(0.3, now);
                gain1.gain.exponentialRampToValueAtTime(0.01, now + 0.7);
                osc1.connect(gain1);
                gain1.connect(ctx.destination);
                osc1.start(now);
                osc1.stop(now + 0.7);
                
                // 2. Rire retro robot (0.8s - 2.8s)
                const notes = [440, 554, 659, 880, 659, 554, 440, 330];
                let noteTime = now + 0.8;
                notes.forEach((freq) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(freq, noteTime);
                    osc.frequency.linearRampToValueAtTime(freq + 40, noteTime + 0.15);
                    osc.frequency.linearRampToValueAtTime(freq - 40, noteTime + 0.25);
                    gain.gain.setValueAtTime(0.15, noteTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, noteTime + 0.28);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(noteTime);
                    osc.stop(noteTime + 0.3);
                    noteTime += 0.25;
                });
                
                // 3. Chute/dégonflement comique (3.0s - 4.5s)
                const osc3 = ctx.createOscillator();
                const gain3 = ctx.createGain();
                osc3.type = 'sine';
                osc3.frequency.setValueAtTime(400, now + 3.0);
                osc3.frequency.linearRampToValueAtTime(80, now + 4.5);
                gain3.gain.setValueAtTime(0.2, now + 3.0);
                gain3.gain.linearRampToValueAtTime(0.01, now + 4.5);
                osc3.connect(gain3);
                gain3.connect(ctx.destination);
                osc3.start(now + 3.0);
                osc3.stop(now + 4.6);
            } catch (e) {
                console.log("Synthesizer failed", e);
            }
        }
    </script>
    <audio id="funny-audio" src="funny.mp3" preload="auto"></audio>
</body>
</html>
