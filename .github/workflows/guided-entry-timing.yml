name: Guided entry timing review
on:
  push:
    branches: [codex/guided-entry-3s-20260927, main]
    paths:
      - 'apps/showcase/src/hooks/**'
      - 'apps/showcase/src/components/Showcase.jsx'
      - 'apps/showcase/src/components/Plan3DBackground.jsx'
      - 'apps/showcase/src/utils/villaEntry.js'
      - 'apps/showcase/scripts/test-guided-entry-*.mjs'
      - 'apps/showcase/scripts/test-villa-entry*.mjs'
      - '.github/workflows/guided-entry-timing.yml'
permissions:
  contents: read
jobs:
  timing-review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        sector: [villa, boutique, restaurant, yacht]
    defaults:
      run:
        working-directory: apps/showcase
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/showcase/package-lock.json
      - run: node --test scripts/test-guided-entry-timing.mjs scripts/test-villa-entry.mjs
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - name: Install isolated browser tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/guided-tools" --no-save playwright@1.57.0
          ln -s "$RUNNER_TEMP/guided-tools/node_modules/playwright" node_modules/playwright
          "$RUNNER_TEMP/guided-tools/node_modules/.bin/playwright" install --with-deps chromium > /tmp/guided-browser.log 2>&1
      - name: Review local entry
        if: github.ref != 'refs/heads/main'
        env:
          SECTOR: ${{ matrix.sector }}
          TEST_OUTPUT: test-results/${{ matrix.sector }}
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/guided-preview.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          if [ "$SECTOR" = villa ]; then node scripts/test-villa-entry-browser.mjs; else node scripts/test-guided-entry-browser.mjs; fi
      - name: Review actual production after publication
        if: github.ref == 'refs/heads/main'
        env:
          BASE_URL: https://crestrongui.vercel.app
          SMOKE: '1'
          SECTOR: ${{ matrix.sector }}
          TEST_OUTPUT: test-results/${{ matrix.sector }}-production
        run: |
          if [ "$SECTOR" = villa ]; then node scripts/test-villa-entry-browser.mjs; else node scripts/test-guided-entry-browser.mjs; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: entry-review-${{ matrix.sector }}
          path: apps/showcase/test-results/
          retention-days: 7
          if-no-files-found: warn
