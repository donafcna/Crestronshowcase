name: Showcase quality
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  catalogue-and-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/showcase/package-lock.json
      - run: npm ci
        working-directory: apps/showcase
      - run: npm run quality:test
        working-directory: apps/showcase
      - run: npm run build
        working-directory: apps/showcase
      - run: npm run lint
        working-directory: apps/showcase
