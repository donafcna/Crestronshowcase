name: Yacht first visible frame
on:
  pull_request:
    paths:
      - 'apps/showcase/src/ftv-luxury/**'
      - 'apps/showcase/public/ftv-luxury/**'
      - 'apps/showcase/scripts/test-yacht-entry*'
      - '.github/workflows/yacht-entry.yml'
permissions:
  contents: read
jobs:
  first-frame:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: apps/showcase
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/showcase/package-lock.json
      - name: Presentation protocol unit tests
        run: node --test scripts/test-yacht-entry.mjs
      - run: npm ci
      - run: npm run build
      - name: Lint
        run: npm run lint > /tmp/entry-lint.log 2>&1 || { cat /tmp/entry-lint.log; exit 1; }; tail -n 3 /tmp/entry-lint.log
      - name: Isolated browser tools
        run: |
          npm install --prefix "$RUNNER_TEMP/entry-tools" --no-save playwright@1.57.0 > /tmp/entry-tools.log 2>&1 || { cat /tmp/entry-tools.log; exit 1; }
          ln -s "$RUNNER_TEMP/entry-tools/node_modules/playwright" node_modules/playwright
          "$RUNNER_TEMP/entry-tools/node_modules/.bin/playwright" install --with-deps chromium > /tmp/entry-browser.log 2>&1 || { tail -n 50 /tmp/entry-browser.log; exit 1; }
      - name: Actual sidebar entry and rendered frame checks
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/entry-preview.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          node scripts/test-yacht-entry-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yacht-entry-review
          path: apps/showcase/test-results/yacht-entry/
          retention-days: 7
